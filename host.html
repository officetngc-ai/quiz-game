  <style>
    /* ========== 全域無卷軸與響應式配置 ========== */
    body { font-family: 'Nunito', sans-serif; text-align: center; margin: 0; padding: 2vh 2vw; color: #fff; overflow: hidden; height: 100vh; box-sizing: border-box; transition: background 0.5s; background-size: 300% 300%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    
    .bg-setup { background-image: linear-gradient(135deg, #667eea, #764ba2); }
    .bg-lobby { background-image: linear-gradient(45deg, #ff9a9e, #fecfef, #a18cd1, #fbc2eb); animation: fluidBg 8s ease infinite; }
    .bg-question { background-image: linear-gradient(45deg, #1fa2ff, #12d8fa, #a6ffcb); animation: fluidBg 6s ease infinite; color: #111;}
    .bg-fast { background-image: repeating-linear-gradient(45deg, #f1c40f, #f1c40f 2vw, #e67e22 2vw, #e67e22 4vw); animation: feverBg 1s linear infinite; color: #111; box-shadow: inset 0 0 5vh #d35400;}
    .bg-wager { background-image: linear-gradient(45deg, #2c3e50, #000000); color: #f1c40f; animation: fluidBg 5s ease infinite; }
    .bg-reveal { background-image: linear-gradient(45deg, #11998e, #38ef7d, #00b09b, #96c93d); animation: fluidBg 4s ease infinite; }
    .bg-podium { background-color: #f1c40f;}
    .bg-shuffle { background: repeating-radial-gradient(circle, #8e44ad, #8e44ad 2vw, #9b59b6 2vw, #9b59b6 4vw); animation: spinBg 4s linear infinite; }
    .bg-traitor { background-image: repeating-radial-gradient(circle, #000, #333 10%); animation: fluidBg 3s ease infinite; color: #fff;}
    
    @keyframes fluidBg { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }
    @keyframes feverBg { 0% {background-position: 0% 0%;} 100% {background-position: 100% 100%;} }
    @keyframes spinBg { from { background-position: 0 0; } to { background-position: 10vw 10vw; } }

    /* ========== 警告與全域控場動畫 ========== */
    #eventWarning { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
    .warning-text { font-size: 15vh; font-weight: 900; color: #f1c40f; text-shadow: 0 0 3vh #f39c12, 0 1vh 0 #d35400; animation: flashText 0.3s infinite alternate; }
    .shuffle-anim { animation: spinAndZoom 1.5s ease-in-out infinite alternate !important; color: #e056fd; text-shadow: 0 0 4vh #be2edd, 0 1vh 0 #686de0;}
    @keyframes flashText { from { transform: scale(1); } to { transform: scale(1.1); color: #fff; } }
    @keyframes spinAndZoom { 0% { transform: scale(0.8) rotate(-5deg); } 100% { transform: scale(1.2) rotate(5deg); color: #fff;} }

    #pauseOverlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; color: white; }
    .pause-icon { font-size: 20vh; animation: pulseWin 1s infinite alternate; text-shadow: 0 1vh 3vh rgba(0,0,0,0.5); }
    .pause-text { font-size: 10vh; font-weight: 900; margin: 2vh 0; letter-spacing: 0.5vw; color: #f1c40f; }

    /* ========== UI 面板 彈性適配 (防破版核心) ========== */
    .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 3vh 3vw; border-radius: 4vh; box-shadow: 0 2vh 5vh rgba(0,0,0,0.15), inset 0 0 0 0.5vh rgba(255,255,255,0.5); width: 95vw; height: 96vh; display: flex; flex-direction: column; justify-content: stretch; align-items: stretch; color: #333; animation: popUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-sizing: border-box; overflow: hidden; transition: box-shadow 0.3s, background-color 0.3s, border 0.3s; }
    @keyframes popUp { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    
    .panel-shake { animation: boxShake 0.4s infinite !important; }
    @keyframes boxShake { 0%, 100% { transform: translateX(0) rotate(0deg); } 25% { transform: translateX(-0.5vw) rotate(-1deg); } 75% { transform: translateX(0.5vw) rotate(1deg); } }

    /* ========== 🚨 最後五秒：霓虹派對光影引擎 ========== */
    .emergency-light { animation: partyPulse 0.5s infinite alternate !important; }
    @keyframes partyPulse {
      0% { box-shadow: inset 0 0 5vh rgba(255, 0, 255, 0.4), 0 2vh 5vh rgba(0,0,0,0.15); background-color: rgba(255, 240, 255, 0.95); }
      50% { box-shadow: inset 0 0 15vh rgba(0, 255, 255, 0.6), 0 2vh 8vh rgba(0,255,255,0.4); background-color: rgba(240, 255, 255, 0.95); }
      100% { box-shadow: inset 0 0 25vh rgba(255, 255, 0, 0.6), 0 2vh 10vh rgba(255,255,0,0.4); background-color: rgba(255, 255, 240, 0.95); }
    }

    /* ========== 中央巨大化倒數特效 (派對歡樂版) ========== */
    #giantTimerOverlay {
        display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 9000; pointer-events: none; font-size: 60vh; font-weight: 900;
        background: linear-gradient(45deg, #ff0844, #ffb199, #fbc2eb, #a18cd1, #8fd3f4); 
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
        filter: drop-shadow(0 2vh 5vh rgba(255, 105, 180, 0.6));
        animation: giantPartyPop 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite; line-height: 1; margin:0; padding:0;
    }
    @keyframes giantPartyPop { 
        0% { transform: translate(-50%, -50%) scale(0.5) rotate(-10deg); opacity: 0; } 
        50% { transform: translate(-50%, -50%) scale(1.2) rotate(10deg); opacity: 1; } 
        100% { transform: translate(-50%, -50%) scale(0.8) rotate(0deg); opacity: 0; } 
    }

    .setup-row { display: flex; justify-content: space-between; align-items: center; margin: 1vh 0; font-size: clamp(14px, 2.5vh, 26px); font-weight: bold; background: rgba(0,0,0,0.05); padding: 1vh 2vw; border-radius: 2vh;}
    .setup-input, .setup-select { font-size: clamp(14px, 1.8vh, 18px); padding: 0.5vh; border-radius: 1vh; border: 0.2vh solid #ccc; font-weight: bold; font-family: inherit;}

    /* ========== 大廳與隨機變形果凍名牌 ========== */
    #teamBuckets { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 2vh; flex: 1; min-height: 0; align-items: stretch; overflow: hidden;}
    .team-bucket { flex: 1 1 20%; min-width: 15vw; border-radius: 3vh; padding: 2vh; color: white; box-shadow: 0 1vh 2vh rgba(0,0,0,0.2); transition: 0.3s; display:flex; flex-direction:column; overflow:hidden;}
    .team-title { font-size: 3vh; font-weight: 900; margin-bottom: 1vh; border-bottom: 0.3vh solid rgba(255,255,255,0.5); padding-bottom: 0.5vh; text-shadow: 0.1vh 0.1vh 0.3vh rgba(0,0,0,0.3); flex-shrink: 0;}
    .players-list { flex: 1; overflow: hidden; display: flex; align-content: flex-start; flex-wrap: wrap; justify-content: center;}
    
    .player-tag { color: #333; font-size: clamp(14px, 2.5vh, 24px); padding: 1vh 1.5vw; margin: 0.5vh; display: inline-flex; align-items: center; gap: 0.5vw; font-weight: 900; box-shadow: 0 1vh 1.5vh rgba(0,0,0,0.15), inset 0 -0.4vh 0.5vh rgba(0,0,0,0.1); border: 0.3vh solid rgba(255,255,255,0.6); }
    @keyframes jellyTag { 0%, 100% { transform: scale(1, 1) rotate(0deg); } 25% { transform: scale(1.05, 0.95) rotate(3deg); } 50% { transform: scale(0.95, 1.05) rotate(-3deg); } 75% { transform: scale(1.02, 0.98) rotate(1deg); } }
    @keyframes superBounceTag { 0% { transform: scale(0) translateY(10vh); opacity:0; } 60% { transform: scale(1.1) translateY(-1vh); opacity:1; } 100% { transform: scale(1) translateY(0); opacity:1; } }
    
    .fire-streak { box-shadow: 0 0 1vh #e74c3c, 0 0 2vh #f1c40f !important; border: 0.2vh solid #e74c3c !important; } 
    .ghost-tag { opacity: 0.5; filter: grayscale(100%); text-decoration: line-through; }

    .lobby-timer-box { font-size: 4vh; font-weight: 900; color: #4a3472; margin-top: 2vh; background: rgba(255,255,255,0.95); padding: 1.5vh 3vw; border-radius: 5vh; box-shadow: 0 1.5vh 2.5vh rgba(0,0,0,0.2); display: inline-block; border: 0.5vh solid #f1c40f; flex-shrink: 0;}
    #groupTimerText { color: #c0392b; font-size: 8vh; display: inline-block; animation: lobbyTimerPulse 0.8s infinite cubic-bezier(0.175, 0.885, 0.32, 1.275); text-shadow: 0 0.4vh 1vh rgba(192,57,43,0.3); margin: 0 1vw;}
    @keyframes lobbyTimerPulse { 0% { transform: scale(1); color: #c0392b; } 50% { transform: scale(1.25) rotate(5deg); color: #900C3F; } 100% { transform: scale(1); color: #c0392b; } }

    #headerContainer { display: inline-flex; justify-content: center; align-items: center; gap: 3vw; margin-bottom: 2vh; flex-shrink: 0;}
    #qrcode { background: white; padding: 1.5vh; border-radius: 2vh; border: 0.6vh dashed #ff6b6b; transform: rotate(-3deg);}
    
    /* ========== 題目與選項排版防破版機制 ========== */
    #questionBox h2 { font-size: clamp(30px, 6vh, 60px); margin: 0 0 1vh 0; line-height: 1.3; flex-shrink: 0; color: #2c3e50; font-weight: 900; }
    .mode-badge { background: linear-gradient(45deg, #f093fb, #f5576c); color: white; padding: 1vh 2vw; border-radius: 3vh; font-size: clamp(16px, 3vh, 32px); vertical-align: middle; margin-left: 1vw; box-shadow: 0 0.5vh 0 #c0392b;}
    
    /* 🚨 修正：圖片顯示 2/3 畫面佔比 */
    #qMedia { height: 45vh; max-width: 100%; object-fit: contain; border-radius: 2vh; display: none; margin: 1vh auto; box-shadow: 0 1vh 2vh rgba(0,0,0,0.2); border: 0.5vh solid white; flex: 0 1 auto; min-height: 0;}
    .fog-anim { animation: fogClear var(--fog-time) linear forwards; }
    @keyframes fogClear { 0% { filter: blur(3vh); } 100% { filter: blur(0); } }

    #matchPromptsContainer { display: none; flex-wrap: wrap; justify-content: center; gap: 1.5vw; margin-top: 1vh; flex: 1; min-height: 0; align-content: center; overflow: hidden;}
    .match-prompt-item { flex: 1 1 auto; max-width: 48%; min-width: 150px; background: white; border-radius: 2vh; padding: 2vh 2vw; box-shadow: 0 1vh 2vh rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(24px, 4vh, 48px); font-weight: 900; position: relative; color: #333;}
    .match-prompt-item img { max-width: 100%; max-height: 12vh; border-radius: 1vh; object-fit: contain;}
    .match-badge { position: absolute; top: -1.5vh; left: -1.5vh; background: #e74c3c; color: white; width: 6vh; height: 6vh; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3.5vh; box-shadow: 0 0.5vh 1vh rgba(0,0,0,0.3); z-index: 5;}

    /* 🚨 修正：限制選項網格自動斷行，列高均分 */
    #optionsContainer { display: grid; gap: 1.5vh 1.5vw; margin-top: 1.5vh; flex: 1 1 auto; min-height: 25vh; width: 100%; box-sizing: border-box; grid-auto-rows: minmax(0, 1fr); overflow: hidden;}
    .option { width: 100%; height: 100%; padding: 1vh 1vw; font-size: clamp(16px, 3.5vh, 40px); font-weight: 900; color: white; border-radius: 3vh; box-shadow: 0 1vh 0 rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; gap: 1vw; box-sizing: border-box; margin: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: scale(0.98); container-type: inline-size; flex-wrap: nowrap; }
    
    /* 🌟 允許文字自然換行，最多顯示 4 行 */
    .opt-text {font-size: clamp(14px, 8cqw, 45px); font-weight: 900; line-height: 1.15; word-break: break-word; white-space: normal; text-align: center; text-shadow: 0 0.3vh 0.5vh rgba(0,0,0,0.3); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; width: 100%; }
    
    .color-0 { background: linear-gradient(135deg, #ff416c, #ff4b2b); box-shadow: 0 1vh 0 #b32a18;} 
    .color-1 { background: linear-gradient(135deg, #0072ff, #00c6ff); box-shadow: 0 1vh 0 #0056b3;} 
    .color-2 { background: linear-gradient(135deg, #f9d423, #ff4e50); box-shadow: 0 1vh 0 #b33200;} 
    .color-3 { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 1vh 0 #0e7a5c;}
    .color-4 { background: linear-gradient(135deg, #8e44ad, #9b59b6); box-shadow: 0 1vh 0 #732d91;}
    .color-5 { background: linear-gradient(135deg, #e67e22, #f39c12); box-shadow: 0 1vh 0 #d35400;}
    .color-6 { background: linear-gradient(135deg, #2c3e50, #34495e); box-shadow: 0 1vh 0 #1a252f;}
    .color-7 { background: linear-gradient(135deg, #e84393, #fd79a8); box-shadow: 0 1vh 0 #b33971;}

    @keyframes superBounce {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(0.98); opacity: 1; } 
    }

    .floating-opt { animation: floatOpt 3s ease-in-out infinite; }
    @keyframes floatOpt { 0%, 100% { transform: scale(0.98) translateY(0px) rotate(0deg); } 33% { transform: scale(0.98) translateY(-0.8vh) rotate(1deg); } 66% { transform: scale(0.98) translateY(0.5vh) rotate(-1deg); } }

    .option.dimmed { opacity: 0.15; transform: scale(0.85); filter: grayscale(100%); animation: none !important; box-shadow: none !important; z-index: 1;}
    .option.highlight { transform: scale(1.02) !important; box-shadow: 0 0 5vh rgba(255, 215, 0, 1), inset 0 0 2vh rgba(255,255,255,0.8) !important; border: 0.8vh solid #FFD700; z-index: 20; animation: none !important; background: linear-gradient(135deg, #f1c40f, #f39c12) !important; color: #000; text-shadow: 0 0.2vh 0.5vh rgba(255,255,255,0.8); }

    #sliderResult { display: none; margin-top: 2vh; background: rgba(255,255,255,0.9); padding: 2vh 3vw; border-radius: 2vh; flex-shrink: 0;}

    #answeredContainer { margin-top: 1.5vh; padding-top: 1.5vh; border-top: 0.3vh dashed rgba(0,0,0,0.1); flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; width: 100%;}
    #answeredCountTitle { font-size: clamp(16px, 2.5vh, 26px); font-weight: 900; color: #555; margin: 0 0 1vh 0; flex-shrink: 0;}
    #answeredGrid { display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 1vh; overflow: hidden; max-height: 12vh; }
    .answered-tag { font-size: clamp(12px, 2vh, 22px); padding: 0.5vh 1vw; border-radius: 3vh; background: rgba(255,255,255,0.9); color: #333; font-weight: 900; box-shadow: 0 0.5vh 1vh rgba(0,0,0,0.15); display: inline-flex; align-items: center; gap: 0.6vw; animation: popInAnswer 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform: scale(0); }
    .answered-tag.top-1 { border: 0.3vh solid #f1c40f; background: #fffdf0; transform: scale(1.15) !important; z-index: 3; }
    .answered-tag.top-2 { border: 0.3vh solid #bdc3c7; transform: scale(1.05) !important; z-index: 2; }
    .answered-tag.top-3 { border: 0.3vh solid #cd7f32; transform: scale(1.0) !important; z-index: 1; }
    @keyframes popInAnswer { 0% { transform: scale(0) translateY(3vh); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1) translateY(0); opacity: 1; } }

    .bottom-timer-row { display: flex; align-items: center; gap: 2vw; margin-top: 1vh; flex-shrink: 0; width: 100%; }
    #timeBarContainer { flex: 1; height: 3vh; background: #eee; border-radius: 2vh; overflow: hidden; box-shadow: inset 0 0.5vh 1vh rgba(0,0,0,0.1);}
    #timeBar { height: 100%; width: 100%; transition: width 1s linear, background 1s linear; }
    
    .bar-stripe { background: repeating-linear-gradient(45deg, #00c6ff, #00c6ff 2vw, #0072ff 2vw, #0072ff 4vw) !important; animation: moveStripes 1s linear infinite; }
    @keyframes moveStripes { 0% {background-position: 0 0;} 100% {background-position: 5.65vw 0;} }
    
    #timerText { font-size: clamp(30px, 6vh, 60px); font-weight: 900; color: #333; width: 8vw; text-align: right;}
    .tick-anim { animation: elasticTick 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes elasticTick { 0% { transform: scale(0.8); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
    
    .panic-timer { animation: partyTick 0.4s infinite alternate !important; color: #e056fd !important; text-shadow: 0 0 3vh #e056fd, 0 0.5vh 0 #686de0 !important; }
    @keyframes partyTick { 0% { transform: scale(1.2) rotate(-5deg); } 100% { transform: scale(1.5) rotate(5deg); } }
    
    .ctrl-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 1.5vh 4vw; font-size: clamp(20px, 3.5vh, 40px); font-weight: 900; border: none; border-radius: 5vh; cursor: pointer; box-shadow: 0 1vh 0 #4a3472; transition: 0.2s; font-family: inherit; margin-top:1vh; flex-shrink: 0;}
    .ctrl-btn:active { transform: translateY(1vh); box-shadow: 0 0 0 #4a3472; }

    .rank-score { color: #ff4b2b; font-family: monospace; font-size: clamp(24px, 4.5vh, 50px); font-weight: 900;}

    /* 🌟 前三名專屬亮光特效 */

  <!-- BGM -->
  <audio id="bgmLobbyObj" loop src="music/lobby.mp3"></audio>
  <audio id="bgmNormalObj" loop src="music/normal.mp3"></audio>
  <audio id="bgmFastObj" loop src="music/fast.mp3"></audio>
  <audio id="bgmRoundObj" loop src="music/round.mp3"></audio>
  <audio id="bgmPodiumObj" loop src="music/podium.mp3"></audio>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSChl0vRMFeEVPH4K5T8OC6R4EXWDsoqwJA68DQxQc58IH1zxaG-A1uly4lZT1jr6x8rJIMGPjJ0vRU/pub?output=csv"; 

    // ========== 柔和化音樂與真實 BGM 引擎 ==========
    let audioCtx;
    let bgmLobby;
    let bgmNormal;
    let bgmFast;
    let bgmRound;
    let bgmPodium;

    let currentBGM = null;

    // 🌟 全域計分紀錄體系 (供跑馬表與名次升降計算使用)
    let previousTeamRanks = {};
    let previousPlayerRanks = {};

    function initAudio() { 
      if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); } 
      
      bgmLobby = document.getElementById('bgmLobbyObj'); 
      bgmNormal = document.getElementById('bgmNormalObj');
      bgmFast = document.getElementById('bgmFastObj');
      if (document.getElementById('bgmRoundObj')) bgmRound = document.getElementById('bgmRoundObj');
      if (document.getElementById('bgmPodiumObj')) bgmPodium = document.getElementById('bgmPodiumObj');
      
      if(bgmLobby) bgmLobby.volume = 0.3; 
      if(bgmNormal) bgmNormal.volume = 0.3; 
      if(bgmFast) bgmFast.volume = 0.5;
      if(bgmRound) bgmRound.volume = 0.4;
      if(bgmPodium) bgmPodium.volume = 0.6;
    }

    function startLobbyBGM() {
        stopBGM();
        if (!bgmLobby) return;
        bgmLobby.volume = 0.3;
        currentBGM = bgmLobby;
        let playPromise = bgmLobby.play();
        if (playPromise !== undefined) {
            playPromise.catch(e => console.log("等待互動以播放大廳 BGM"));
        }
    }

    function startPartyBGM() {
        stopBGM(); 
        
        if (!bgmNormal) return;
        bgmNormal.volume = 0.3;
        currentBGM = bgmNormal;
        let playPromise = bgmNormal.play();
        if (playPromise !== undefined) {
            playPromise.catch(e => console.log("等待互動以播放答題 BGM"));
        }
    }

    function overlayFastBGM(isFast) {
        if (!bgmFast || !bgmNormal) return;
        if (isFast) {
            bgmNormal.volume = 0.1; 
            if (bgmFast.paused) {
                bgmFast.currentTime = 0; 
                let playPromise = bgmFast.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => console.log("等待互動以播放快節奏 BGM"));
                }
            }
        } else {
            bgmNormal.volume = 0.3; 
            bgmFast.pause();
            bgmFast.currentTime = 0;
        }
    }
    
    function stopBGM() {
        if(bgmLobby) { bgmLobby.pause(); bgmLobby.currentTime = 0; } 
        if(bgmNormal) { bgmNormal.pause(); bgmNormal.currentTime = 0; }
        if(bgmFast) { bgmFast.pause(); bgmFast.currentTime = 0; }
        if(typeof bgmRound !== 'undefined' && bgmRound) { bgmRound.pause(); bgmRound.currentTime = 0; }
        if(typeof bgmPodium !== 'undefined' && bgmPodium) { bgmPodium.pause(); bgmPodium.currentTime = 0; }
        currentBGM = null;
    }

    function playRoundBGM() {
        stopBGM();
        if(bgmRound) bgmRound.play().catch(e=>{});
    }

    function playPodiumBGM() {
        stopBGM();
        if(bgmPodium) bgmPodium.play().catch(e=>{});
    }

    function playTone(freq, type, duration, vol=0.1) { 
      if(!audioCtx) return; 
      const osc = audioCtx.createOscillator(); 
      const gain = audioCtx.createGain(); 
      osc.type = type; 
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime); 
      gain.gain.setValueAtTime(vol, audioCtx.currentTime); 
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration); 
      osc.connect(gain); gain.connect(audioCtx.destination); 
      osc.start(); osc.stop(audioCtx.currentTime + duration); 
    }
    function playJoin() { initAudio(); playTone(600, 'sine', 0.1); setTimeout(()=>playTone(800, 'sine', 0.15), 100); } 
    function playStart() { initAudio(); playTone(523, 'triangle', 0.1); setTimeout(() => playTone(659, 'triangle', 0.1), 150); setTimeout(() => playTone(784, 'triangle', 0.4), 300); }
    function playWarning() { initAudio(); playTone(400, 'sine', 0.2, 0.2); setTimeout(()=>playTone(500, 'sine', 0.3, 0.2), 200); } 
    function playShuffleSound() { initAudio(); playTone(300, 'triangle', 0.1); setTimeout(()=>playTone(400, 'triangle', 0.1), 100); setTimeout(()=>playTone(500, 'triangle', 0.1), 200); setTimeout(()=>playTone(600, 'triangle', 0.1), 300); setTimeout(()=>playTone(800, 'triangle', 0.5), 400); }
    function playTickFast() { initAudio(); playTone(800, 'square', 0.1, 0.08); } 
    function playTick() { initAudio(); playTone(600, 'sine', 0.1, 0.05); } 
    function playReveal() { initAudio(); playTone(659, 'sine', 0.1); setTimeout(() => playTone(1046, 'sine', 0.5), 100); } 
    function playWin() { initAudio(); playTone(523, 'triangle', 0.1); setTimeout(() => playTone(659, 'triangle', 0.1), 100); setTimeout(() => playTone(783, 'triangle', 0.1), 200); setTimeout(() => playTone(1046, 'triangle', 0.6), 300); }
    function playFirstBlood() { initAudio(); playTone(880, 'triangle', 0.1); setTimeout(() => playTone(1108, 'triangle', 0.1), 100); setTimeout(() => playTone(1318, 'triangle', 0.4), 200); } 
    
    function playPopSound() { 
      initAudio(); 
      const randomFreq = 800 + Math.random() * 400; 
      playTone(randomFreq, 'sine', 0.05, 0.08); 
    }

    let isGlobalPaused = false;
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        if (e.code === 'Space') {
            e.preventDefault(); 
            isGlobalPaused = !isGlobalPaused;
            document.getElementById('pauseOverlay').style.display = isGlobalPaused ? 'flex' : 'none';
            broadcast({ type: 'GAME_PAUSED', isPaused: isGlobalPaused });
        }
    });

    function toggleTeamInputs() {
      const mode = document.getElementById('cfgMode').value;
      document.getElementById('teamOptionsBox').style.display = mode === 'teams' ? 'flex' : 'none';
    }

    let questions = []; let currentQIndex = -1; let countdownInterval; let isAcceptingAnswers = false;
    let connectionsMap = {}; let answeredPlayers = new Set(); let questionStartTime = 0;
    
    let gameConfig = {}; let teamsData = []; let playerStats = {}; 
    let currentRoundData = []; let groupTimerInterval;
    let currentScrambledCorrect = []; 
    let highestBidder = null; let highestBid = 0;
    let currentMatchups = []; 
    
    const shapeList = ['▲','◆','●','■','★','✚','✦','✖','▼','⬣'];

    const roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();

    function createPlayerTagElement(name, avatar, idStr = "") {
      const tag = document.createElement('div'); 
      tag.className = 'player-tag'; 
      if(idStr) tag.id = idStr;
      tag.innerHTML = `<span style="font-size:3.5vh; filter: drop-shadow(0 0.2vh 0.2vh rgba(0,0,0,0.2));">${avatar}</span> <span style="text-shadow: 0 0.1vh 0.2vh rgba(255,255,255,0.8);">${name}</span>`;
      
      const blobs = [
        '30% 70% 70% 30% / 30% 30% 70% 70%', '60% 40% 30% 70% / 60% 30% 70% 40%',
        '40% 60% 70% 30% / 40% 50% 60% 50%', '70% 30% 40% 60% / 50% 70% 30% 50%',
        '50% 50% 20% 80% / 25% 80% 20% 75%', '3vh', '4vh'
      ];
      const colors = [
        'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)', 'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)',
        'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)', 'linear-gradient(135deg, #cfd9df 0%, #e2ebf0 100%)',
        'linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)', 'linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)',
        'linear-gradient(135deg, #fccb90 0%, #d57eeb 100%)', 'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)',
        'linear-gradient(135deg, #ff0844 0%, #ffb199 100%)', 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
        'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)', 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)'
      ];
      
      tag.style.borderRadius = blobs[Math.floor(Math.random() * blobs.length)];
      tag.style.background = colors[Math.floor(Math.random() * colors.length)];
      const animDelay = (Math.random() * 0.5).toFixed(2);
      const animDur = (2 + Math.random()).toFixed(2);
      tag.style.animation = `superBounceTag 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both, jellyTag ${animDur}s infinite ease-in-out alternate ${animDelay}s`;
      
      return tag;
    }

    function generateTeamStyles(count) {
      let cssString = ""; teamsData = [];
      const emojis = ['🔥','🌊','⚡','🌲','💫','🔮','💎','🌋','🌀','🪐','🌪️','☄️'];
      const names = ['赤焰','冰霜','閃電','森林','幻星','魔晶','耀石','熔岩','風暴','星環','龍捲','彗星'];

      for (let i = 0; i < count; i++) {
        const hue = Math.floor((i / count) * 360);
        const color1 = `hsl(${hue}, 80%, 60%)`; const color2 = `hsl(${(hue + 20) % 360}, 100%, 40%)`;
        cssString += `.t-${i} { background: linear-gradient(135deg, ${color1}, ${color2}); } .bg-t-${i} { background: linear-gradient(135deg, ${color1}, ${color2}); }`;
        const e = emojis[i % emojis.length]; const n = names[i % names.length] + `聯盟`;
        teamsData.push({ id: i, name: `${e} ${n}`, class: `t-${i}`, gradient: `linear-gradient(135deg, ${color1}, ${color2})`, players: [], isEliminated: false });
      }
      document.getElementById('dynamicTeamStyles').innerHTML = cssString;
    }

    function animateValue(obj, start, end, duration) {
      if (start === end) { obj.innerHTML = end; return; }
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        obj.innerHTML = Math.floor(progress * (end - start) + start);
        if (progress < 1) {
            window.requestAnimationFrame(step);
        } else {
            obj.innerHTML = end; 
        }
      };
      window.requestAnimationFrame(step);
    }

    // 🚨 Firebase 廣播指令給所有玩家
    function broadcast(messageObj, targetName = null) { 
      if(!window.firebaseReady) return;
      if (targetName) {
         sendToPlayer(targetName, messageObj);
         return;
      }
      window.set(window.ref(window.db, `rooms/${roomCode}/hostBroadcast`), { ts: Date.now(), msg: messageObj });
    }

    // 發送私訊給單一玩家
    function sendToPlayer(playerName, messageObj) {
      if(!window.firebaseReady) return;
      window.set(window.ref(window.db, `rooms/${roomCode}/privateMsgs/${playerName}`), { ts: Date.now(), msg: messageObj });
    }

    function initLobby() {
      if (!window.firebaseReady) return alert("Firebase 尚未載入完成，請確認金鑰設定是否正確。");

      if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if(audioCtx.state === 'suspended') audioCtx.resume();
      
      let audios = [
          document.getElementById('bgmLobbyObj'), document.getElementById('bgmNormalObj'), 
          document.getElementById('bgmFastObj'), document.getElementById('bgmRoundObj'), 
          document.getElementById('bgmPodiumObj')
      ];
      audios.forEach(a => { 
          if(a) { 
              a.muted = true; 
              let p = a.play();
              if (p !== undefined) {
                  p.then(() => {
                      a.pause();
                      a.currentTime = 0;
                      a.muted = false;
                  }).catch(e => console.log("Audio unlock blocked:", e));
              }
          } 
      });
      
      initAudio();
      setTimeout(() => { startLobbyBGM(); }, 200); 

      let shuffleInput = parseInt(document.getElementById('cfgShuffle').value);
      gameConfig = {
        isTeamMode: document.getElementById('cfgMode').value === 'teams',
        teamCount: parseInt(document.getElementById('cfgTeams').value) || 2,
        maxPerTeam: parseInt(document.getElementById('cfgMax').value) || 10,
        groupTime: parseInt(document.getElementById('cfgTime').value) || 60,
        winMode: document.getElementById('cfgWin').value,
        shuffleRound: (isNaN(shuffleInput) || shuffleInput <= 0) ? -1 : shuffleInput,
        useMedia: document.getElementById('cfgMedia').checked,
        useAdvType: document.getElementById('cfgAdvType').checked,
        useEconomy: document.getElementById('cfgEconomy').checked,
        useSabotage: document.getElementById('cfgSabotage').checked,
        useGhost: document.getElementById('cfgGhost').checked,
        useExtreme: document.getElementById('cfgExtreme').checked,
        useTournament: document.getElementById('cfgTournament').checked,
        useAvatarAnim: document.getElementById('cfgAvatarAnim') ? document.getElementById('cfgAvatarAnim').checked : true, 
        tournInterval: parseInt(document.getElementById('cfgTournInterval').value) || 3,
        tournElimCount: parseInt(document.getElementById('cfgTournElimCount').value) || 1
      };

      generateTeamStyles(gameConfig.teamCount);
      const bucketsContainer = document.getElementById('teamBuckets'); bucketsContainer.innerHTML = '';

      if (gameConfig.isTeamMode) {
        document.getElementById('lobbyWaitText').innerText = "✨ 相機掃描 QR Code 選擇陣營！";
        document.getElementById('lobbyTimerBox').innerHTML = `倒數自動分組：<span id="groupTimerText">${gameConfig.groupTime}</span> 秒`;
        document.getElementById('forceStartBtn').innerText = "跳過等待，隨機分組並開始 ➡️";
        
        teamsData.forEach(t => {
          bucketsContainer.innerHTML += `<div class="team-bucket ${t.class}" id="bucket-${t.id}"><div class="team-title">${t.name} (0/${gameConfig.maxPerTeam})</div><div id="players-${t.id}" class="players-list"></div></div>`;
        });
      } else {
        document.getElementById('lobbyWaitText').innerText = "✨ 相機掃描 QR Code 加入英雄榜！";
        document.getElementById('lobbyTimerBox').style.display = 'inline-block'; 
        document.getElementById('lobbyTimerBox').innerHTML = `倒數開始遊戲：<span id="groupTimerText">${gameConfig.groupTime}</span> 秒`;
        document.getElementById('forceStartBtn').innerText = "跳過等待，立刻開始 ➡️";
        bucketsContainer.style.display = "flex"; bucketsContainer.style.flexWrap = "wrap"; bucketsContainer.style.justifyContent = "center"; bucketsContainer.style.alignContent = "flex-start";
      }

      document.getElementById('setupScreen').style.display = 'none'; document.body.className = 'bg-lobby';
      document.getElementById('lobbyScreen').style.display = 'flex';

      const baseUrl = window.location.href.split('?')[0].split('#')[0].replace(/host\.html$/, '').replace(/\/$/, '') + '/';
      new QRCode(document.getElementById("qrcode"), { 
          text: baseUrl + "index.html?pin=" + roomCode, 
          width: 180, height: 180, colorDark : "#ff4b2b", colorLight : "#fff", correctLevel : QRCode.CorrectLevel.H 
      });

      window.remove(window.ref(window.db, `rooms/${roomCode}`));
      
      window.onChildAdded(window.ref(window.db, `rooms/${roomCode}/playerMsgs`), (snapshot) => {
        const data = snapshot.val();
        if(!data) return;

        let conn = connectionsMap[data.name];
        if (!conn) {
            conn = {
                playerName: data.name,
                open: true,
                send: (msgObj) => sendToPlayer(data.name, msgObj)
            };
            connectionsMap[data.name] = conn;
        }

        if (data.type === 'JOIN') {
          playJoin();
          if(!playerStats[data.name]) {
              playerStats[data.name] = { teamId: -1, score: 0, correctCount: 0, fastWins: 0, fastScore: 0, streak: 0, hasShield: false, isGhost: false, isTraitor: false, avatar: data.avatar || '👤', isEliminated: false };
              let pCountEl = document.getElementById('lobbyPlayerCount');
              if (pCountEl) pCountEl.innerText = Object.keys(playerStats).length;
          }
          
          if (playerStats[data.name].isEliminated) {
               conn.send({ type: 'ELIMINATED' });
               return;
          }

          if (gameConfig.isTeamMode) {
            if (playerStats[data.name].teamId !== -1) {
                const existingTeam = teamsData.find(t => t.id === playerStats[data.name].teamId);
                if (existingTeam) {
                    conn.send({ type: 'TEAM_ASSIGNED', teamName: existingTeam.name, teamClass: existingTeam.class, teamGrad: existingTeam.gradient, cfg: gameConfig });
                    return;
                }
            }
            conn.send({ type: 'TEAM_SELECTION_START', teams: teamsData, max: gameConfig.maxPerTeam, css: document.getElementById('dynamicTeamStyles').innerHTML, cfg: gameConfig });
          } else {
            if (!document.getElementById(`ptag-${data.name}`)) {
                const tag = createPlayerTagElement(data.name, data.avatar || '👤', `ptag-${data.name}`);
                bucketsContainer.appendChild(tag);
            }
            conn.send({ type: 'INDIVIDUAL_MODE_WAIT', cfg: gameConfig });
          }
        }
        else if (data.type === 'SYNC_AVATAR') {
           if(playerStats[conn.playerName]) {
               playerStats[conn.playerName].avatar = data.avatar;
               let ptag = document.getElementById(`ptag-${conn.playerName}`);
               if(ptag) ptag.innerHTML = `<span style="font-size:3.5vh; filter: drop-shadow(0 0.2vh 0.2vh rgba(0,0,0,0.2));">${data.avatar}</span> <span style="text-shadow: 0 0.1vh 0.2vh rgba(255,255,255,0.8);">${conn.playerName}</span>`;
           }
        }
        else if (data.type === 'SELECT_TEAM' && gameConfig.isTeamMode) { handleTeamSelection(conn, data.teamId); }
        else if (data.type === 'ANSWER') { handleAnswer(conn, data); }
        else if (data.type === 'USE_SKILL' && gameConfig.useSabotage) { handleSkill(conn, data.skill); }
        else if (data.type === 'SUBMIT_WAGER' && gameConfig.useEconomy) { 
          conn.wager = data.amount; 
          if(data.target) conn.bountyTarget = data.target; else conn.bountyTarget = null;
        }
        else if (data.type === 'SUBMIT_BID' && gameConfig.useExtreme) { conn.bidAmount = data.amount; }
      });

      loadQuestions(); 

      let timeLeft = gameConfig.groupTime; 
      const timerTextEl = document.getElementById('groupTimerText');
      if(timerTextEl) timerTextEl.innerText = timeLeft;
      
      groupTimerInterval = setInterval(() => {
        if (isGlobalPaused) return; 
        timeLeft--; 
        if(document.getElementById('groupTimerText')) document.getElementById('groupTimerText').innerText = timeLeft;
        
        broadcast({ type: 'TIMER_SYNC', timeLeft: timeLeft, isFast: false, maxTime: gameConfig.groupTime, timerStyle: 0 });

        if(timeLeft <= 0) { clearInterval(groupTimerInterval); autoAssignAndStart(); }
      }, 1000);
    }

    function handleTeamSelection(conn, teamId) {
      const pName = conn.playerName; 
      const team = teamsData.find(t => t.id === teamId);
      
      if (playerStats[pName].teamId !== -1) {
        const exTeam = teamsData.find(t => t.id === playerStats[pName].teamId);
        if(exTeam) {
          conn.send({ type: 'TEAM_ASSIGNED', teamName: exTeam.name, teamClass: exTeam.class, teamGrad: exTeam.gradient, cfg: gameConfig });
        }
        return;
      }

      if (team && team.players.length < gameConfig.maxPerTeam && playerStats[pName].teamId === -1) {
        team.players.push(pName); playerStats[pName].teamId = teamId;
        document.getElementById(`bucket-${teamId}`).querySelector('.team-title').innerText = `${team.name} (${team.players.length}/${gameConfig.maxPerTeam})`;
        document.getElementById(`players-${teamId}`).appendChild(createPlayerTagElement(pName, playerStats[pName].avatar, `ptag-${pName}`));
        
        conn.send({ type: 'TEAM_ASSIGNED', teamName: team.name, teamClass: team.class, teamGrad: team.gradient, cfg: gameConfig });
        broadcast({ type: 'TEAM_UPDATED', teams: teamsData, max: gameConfig.maxPerTeam }); playJoin();
      }
    }

    function handleSkill(conn, skillType) {
      const pName = conn.playerName; const stats = playerStats[pName];
      if (skillType === 'shield' && stats.score >= 300) {
        stats.score -= 300; stats.hasShield = true;
        conn.send({ type: 'SKILL_SUCCESS', msg: "護盾啟動！可抵禦一次攻擊。" });
      } else if (skillType === '5050' && stats.score >= 200) {
        const qType = questions[currentQIndex].type;
        if (qType === 'single' || qType === 'multiple') {
          stats.score -= 200;
          const correctAns = questions[currentQIndex].correct;
          const totalOpts = questions[currentQIndex].options.length;
          let wrongOpts = Array.from({length: totalOpts}, (_, i) => i).filter(i => !correctAns.includes(i));
          let removeCount = Math.floor(wrongOpts.length / 2);
          if (removeCount < 1 && wrongOpts.length > 0) removeCount = 1;
          wrongOpts = wrongOpts.sort(() => 0.5 - Math.random()).slice(0, removeCount); 
          conn.send({ type: 'SKILL_5050_RESULT', wrongOpts: wrongOpts });
        } else { conn.send({ type: 'SKILL_SUCCESS', msg: "此題型無法使用 50/50 救援！" }); }
      } else if ((skillType === 'freeze' || skillType === 'scramble') && stats.score >= 500) {
        let enemies = [];
        if (gameConfig.isTeamMode) {
           enemies = Object.values(connectionsMap).filter(c => c.playerName && c.playerName !== pName && playerStats[c.playerName].teamId !== stats.teamId && !playerStats[c.playerName].isGhost && !playerStats[c.playerName].isEliminated);
        } else {
           enemies = Object.values(connectionsMap).filter(c => c.playerName && c.playerName !== pName && !playerStats[c.playerName].isGhost && !playerStats[c.playerName].isEliminated);
        }

        if(enemies.length > 0) {
          stats.score -= 500;
          let tgtConn = enemies[Math.floor(Math.random() * enemies.length)];
          if (playerStats[tgtConn.playerName].hasShield) {
            playerStats[tgtConn.playerName].hasShield = false;
            conn.send({ type: 'SKILL_SUCCESS', msg: `攻擊了 ${tgtConn.playerName}，但被對方的護盾擋下了！` });
          } else {
            tgtConn.send({ type: 'BE_ATTACKED', effect: skillType });
            conn.send({ type: 'SKILL_SUCCESS', msg: `成功對 ${tgtConn.playerName} 發動戰術干擾！` });
          }
        } else { conn.send({ type: 'SKILL_SUCCESS', msg: `找不到敵人可以攻擊！` }); }
      }
    }

    function buildMatchups(activeTeamIds) {
        let matchups = [];
        activeTeamIds.sort(() => Math.random() - 0.5);
        for(let i=0; i<activeTeamIds.length; i+=2) {
            if(i+1 < activeTeamIds.length) {
                matchups.push([activeTeamIds[i], activeTeamIds[i+1]]);
            } else {
                matchups.push([activeTeamIds[i]]); // Bye (晉級)
            }
        }
        return matchups;
    }

    function autoAssignAndStart() {
      clearInterval(groupTimerInterval);
      if (gameConfig.isTeamMode) {
        let unassignedConns = Object.values(connectionsMap).filter(c => c.playerName && playerStats[c.playerName].teamId === -1 && !playerStats[c.playerName].isEliminated);
        unassignedConns.sort(() => Math.random() - 0.5);
        unassignedConns.forEach(conn => {
          let availableTeams = teamsData.filter(t => t.players.length < gameConfig.maxPerTeam);
          if(availableTeams.length > 0) {
            availableTeams.sort((a,b) => a.players.length - b.players.length);
            const t = availableTeams[0]; t.players.push(conn.playerName); playerStats[conn.playerName].teamId = t.id;
            conn.send({ type: 'TEAM_ASSIGNED', teamName: t.name, teamClass: t.class, teamGrad: t.gradient, cfg: gameConfig });
          }
        });

        if(gameConfig.useTournament) {
            let activeTeamIds = teamsData.map(t => t.id);
            currentMatchups = buildMatchups(activeTeamIds);
        }
      }
      document.getElementById('lobbyScreen').style.display = 'none';
      nextQuestion();
    }

    async function loadQuestions() {
      if (!SHEET_CSV_URL) { useDefaultQuestions(); return; }
      try {
        const response = await fetch(SHEET_CSV_URL); const csvText = await response.text();
        Papa.parse(csvText, { header: false, skipEmptyLines: true, complete: function(results) {
            questions = results.data.slice(1).map(row => {
              if(!row || row.length < 3 || !row[0] || row[0].trim() === '') return null;
              const type = row[0].trim().toLowerCase();
              const q = row[1] ? row[1].trim() : "請看圖片作答"; 
              const correctArray = row[2].toString().split(',').map(n => parseInt(n.trim()));
              const modeRaw = row[3] ? row[3].trim().toLowerCase() : 'normal';
              const mediaUrl = row[4] ? row[4].trim() : '';
              
              let timeLimit = parseInt(row[5]);
              if (isNaN(timeLimit) || timeLimit <= 0) { timeLimit = (modeRaw.includes('fast')) ? 10 : 15; }

              let opts = [];
              for(let i = 6; i < row.length; i++) {
                 if(row[i] !== undefined && row[i].trim() !== '') opts.push(row[i].trim());
              }
              if (opts.length === 0) opts = ["正確", "錯誤"];
              return { type: type, q: q, options: opts, correct: correctArray, mode: modeRaw, media: mediaUrl, time: timeLimit };
            }).filter(q => q !== null);
          }
        });
      } catch (err) { useDefaultQuestions(); }
    }
    
    function useDefaultQuestions() {
      questions = [
        { type: "single", mode: "normal", q: "【無限制選項展示】一星期有幾天？(七個選項)", options: ["1天", "2天", "3天", "4天", "5天", "6天", "7天"], correct: [6], media: "", time: 15 },
        { type: "single", mode: "minefield", q: "【地雷陷阱】選錯直接扣500分！太陽系中最大的行星是？", options: ["金星", "火星", "木星", "地球"], correct: [2], media: "", time: 15 },
        { type: "single", mode: "memory", q: "【閃憶模式】選項只有3秒記憶時間！蘋果的英文是？", options: ["Apple", "Banana", "Cherry", "Date"], correct: [0], media: "", time: 10 },
        { type: "single", mode: "chameleon", q: "【迷霧文字】字體會忽隱忽現！水的化學式？", options: ["CO2", "H2O", "O2", "H2"], correct: [1], media: "", time: 15 },
        { type: "single", mode: "auction", q: "【搶答拍賣】出價最高的隊伍才能回答！答對贏雙倍，答錯倒扣！", options: ["紅", "綠", "藍", "黃"], correct: [2], media: "", time: 20 },
        { type: "single", mode: "traitor", q: "【背叛者模式】有內鬼！請找出誰在說謊誤導大家！", options: ["A", "B", "C", "D"], correct: [3], media: "", time: 20 },
        { type: "match_drag", mode: "normal", q: "【連連看-拖曳】依大螢幕圖示，在手機將選項拖曳排序！", options: ["蘋果", "香蕉", "葡萄", "西瓜", "芒果"], correct: [0, 1, 2, 3, 4], media: "🍎 | 🍌 | 🍇 | 🍉 | 🥭", time: 30 },
        { type: "match_click", mode: "normal", q: "【連連看-按壓】依照大螢幕隨機出現的順序，在手機依序點擊", options: ["春天", "夏天", "秋天", "冬天"], correct: [0, 1, 2, 3], media: "Spring | Summer | Autumn | Winter", time: 25 },
        { type: "slider", mode: "normal", q: "【精準拉桿】水在常溫常壓的沸點是幾度？", options: ["0", "200"], correct: [100], media: "", time: 15 }
      ];
    }

    function handleAnswer(conn, data) {
      if (!isAcceptingAnswers || answeredPlayers.has(conn.playerName) || isGlobalPaused) return;
      const qData = questions[currentQIndex]; 

      if (qData.mode === 'auction' && gameConfig.useExtreme) {
        if(gameConfig.isTeamMode) { if (playerStats[conn.playerName].teamId !== highestBidder) return; } 
        else { if (conn.playerName !== highestBidder) return; }
      }

      answeredPlayers.add(conn.playerName);

      let currentRank = answeredPlayers.size;
      let countEl = document.getElementById('answeredCount');
      if (countEl) countEl.innerText = currentRank;

      if (gameConfig.useAvatarAnim) {
          let playerAvatar = playerStats[conn.playerName] ? playerStats[conn.playerName].avatar : '👤';
          let tagNode = createPlayerTagElement(conn.playerName, playerAvatar);
          
          let medal = '✅'; 
          if (currentRank === 1) { medal = '🥇'; tagNode.style.border = '0.4vh solid #f1c40f'; }
          else if (currentRank === 2) { medal = '🥈'; tagNode.style.border = '0.4vh solid #bdc3c7'; }
          else if (currentRank === 3) { medal = '🥉'; tagNode.style.border = '0.4vh solid #cd7f32'; }

          tagNode.innerHTML = `<span style="font-size:2.5vh; margin-right:0.5vw;">${medal}</span>` + tagNode.innerHTML;
          
          let gridEl = document.getElementById('answeredGrid');
          if (gridEl) gridEl.appendChild(tagNode);
      }

      if (typeof playPopSound === 'function') playPopSound();

      const correctAnsArray = qData.correct;
      const answers = data.answers;
      let isCorrect = false; let earnedScore = 0;
      let timeTaken = Date.now() - questionStartTime;
      const maxTimeMs = (qData.time || 15) * 1000;

      if (qData.mode === 'majority' && gameConfig.useAdvType) {
        conn.tempResult = { isCorrect: false, earnedScore: 0, pVal: answers[0], timeTaken: timeTaken };
        currentRoundData.push({ name: conn.playerName, time: timeTaken, isCorrect: false, scoreToAdd: 0 });
        return;
      }

      if (qData.type === 'slider' && gameConfig.useAdvType) {
        const pVal = parseInt(answers[0]); const cVal = qData.correct[0];
        const range = parseInt(qData.options[1]) - parseInt(qData.options[0]);
        const err = Math.abs(pVal - cVal);
        if (err === 0) { isCorrect = true; earnedScore = 1000; }
        else if (err <= range * 0.2) { isCorrect = true; earnedScore = Math.floor(1000 * (1 - err/(range*0.2))); } 
      } 
      else if ((qData.type === 'order' || qData.type === 'match_drag' || qData.type === 'match_click') && gameConfig.useAdvType) {
        let refArray = (qData.type.startsWith('match_')) ? currentScrambledCorrect : qData.correct;
        if (answers.length === refArray.length && answers.every((v, i) => v === refArray[i])) { 
            isCorrect = true; earnedScore = 1000; 
        } else {
            let correctPos = 0;
            answers.forEach((v, i) => { if(v === refArray[i]) correctPos++; });
            earnedScore = Math.floor(correctPos * (1000 / refArray.length));
            if(correctPos === refArray.length) isCorrect = true;
        }
      } 
      else {
        if (answers.length > 0) {
          let correctCount = 0; let wrongSelected = false;
          for (let i = 0; i < answers.length; i++) { if (qData.correct.includes(answers[i])) correctCount++; else { wrongSelected = true; break; } }
          if (!wrongSelected && answers.length === qData.correct.length) { isCorrect = true; earnedScore = 1000; }
          else if (!wrongSelected) { isCorrect = true; earnedScore = Math.floor(1000 * (correctCount / qData.correct.length)); }
        }
      }

      // 迷霧模式：越晚答分數越低
      if (qData.mode.includes('fog') && gameConfig.useMedia && isCorrect) {
        earnedScore = Math.floor(earnedScore * ((maxTimeMs - timeTaken) / maxTimeMs));
        if(earnedScore < 100) earnedScore = 100;
      }

      // 搶答模式：前 3 秒盲猜答錯的極限懲罰
      if ((qData.mode.includes('fast_single') || qData.mode.includes('fast_rank')) && gameConfig.useExtreme && !isCorrect && timeTaken < 3000) {
        earnedScore = -300;
      }

      if (qData.mode === 'minefield' && gameConfig.useExtreme && !isCorrect) {
        earnedScore = -500;
      }

      let multiplier = 1;
      if (gameConfig.useEconomy) {
        if (isCorrect) { multiplier = 1 + (playerStats[conn.playerName].streak * 0.2); if(multiplier > 1.5) multiplier = 1.5; }
      }
      earnedScore = Math.floor(earnedScore * multiplier);
      
      if (qData.mode === 'wager' && gameConfig.useEconomy) {
        let wagerAmt = parseInt(conn.wager) || 0; 
        if (isCorrect) earnedScore += wagerAmt; else earnedScore -= wagerAmt; 
      } else if (qData.mode === 'auction' && gameConfig.useExtreme) {
        if (isCorrect) earnedScore += highestBid; else earnedScore -= highestBid;
      }

      conn.tempResult = { isCorrect, earnedScore, pVal: answers[0], timeTaken: timeTaken };
      currentRoundData.push({ name: conn.playerName, time: timeTaken, isCorrect: isCorrect, scoreToAdd: earnedScore });

    function processElimination() {
        if (!gameConfig.useTournament) return;
        let isElimRound = ((currentQIndex + 1) % gameConfig.tournInterval === 0);
        if (!isElimRound) return;

        const warning = document.getElementById('eventWarning');
        const titleEl = document.getElementById('warningTitle');
        const subEl = document.getElementById('warningSub');
        
        warning.style.display = 'flex';
        titleEl.innerText = "🚨 淘汰結算 🚨";
        titleEl.className = "warning-text shuffle-anim"; 
        subEl.innerText = "殘酷時刻！結算淘汰名單...";
        playWarning();

        setTimeout(() => { warning.style.display = 'none'; }, 4000);

        if (!gameConfig.isTeamMode) {
            let activePlayers = Object.keys(playerStats).filter(p => !playerStats[p].isEliminated);
            activePlayers.sort((a, b) => playerStats[b].score - playerStats[a].score);
            let elimCount = Math.min(gameConfig.tournElimCount, activePlayers.length - 1); 
            if(elimCount > 0) {
                for (let i = 0; i < elimCount; i++) {
                    let loser = activePlayers[activePlayers.length - 1 - i];
                    playerStats[loser].isEliminated = true;
                    let conn = connectionsMap[loser];
                    if (conn && conn.open) conn.send({ type: 'ELIMINATED' });
                }
            }
        } else {
            let nextActiveTeams = [];
            currentMatchups.forEach(match => {
                if (match.length === 2) {
                    let t1 = match[0], t2 = match[1];
                    let s1 = getTeamScore(t1), s2 = getTeamScore(t2);
                    let loserId = s1 > s2 ? t2 : (s2 > s1 ? t1 : (Math.random()>0.5 ? t1 : t2)); 
                    let winnerId = (loserId === t1) ? t2 : t1;
                    teamsData.find(t => t.id === loserId).isEliminated = true;
                    nextActiveTeams.push(winnerId);
                    
                    teamsData.find(t => t.id === loserId).players.forEach(p => {
                        playerStats[p].isEliminated = true;
                        let conn = connectionsMap[p];
                        if (conn && conn.open) conn.send({ type: 'ELIMINATED' });
                    });
                } else {
                    nextActiveTeams.push(match[0]); 
                }
            });
            currentMatchups = buildMatchups(nextActiveTeams);
        }
    }

    function getTeamScore(teamId) {
        let team = teamsData.find(t => t.id === teamId);
        let score = 0;
        team.players.forEach(p => score += playerStats[p].score);
        return score;
    }

    function revealAnswer() {
      overlayFastBGM(false); 
      document.body.className = "bg-reveal"; playReveal();
      document.querySelector('.glass-panel').classList.remove('panel-shake', 'emergency-light');
      document.querySelector('.glass-panel').style.border = 'none';
      document.querySelector('.glass-panel').style.boxShadow = '0 2vh 5vh rgba(0,0,0,0.15), inset 0 0 0 0.5vh rgba(255,255,255,0.5)';
      document.getElementById('timerText').classList.remove('panic-timer');
      document.getElementById('giantTimerOverlay').style.display = 'none';

      const qData = questions[currentQIndex]; 
      if (!qData) { showTeamPodium(); return; }
      
      const currentMode = qData.mode; 
      const qType = qData.type; 
      let correctAns = qData.correct;
      
      if (currentMode === 'majority' && gameConfig.useAdvType) {
        let counts = {};
        for(let i=0; i<questions[currentQIndex].options.length; i++) counts[i] = 0;
        Object.values(connectionsMap).forEach(c => { if(c.tempResult && c.tempResult.pVal !== undefined) counts[c.tempResult.pVal]++; });
        let maxVote = -1; let maxOpt = 0;
        for(let i=0; i<questions[currentQIndex].options.length; i++) { if(counts[i] > maxVote) { maxVote = counts[i]; maxOpt = i; } }
        correctAns = [maxOpt];
        
        Object.values(connectionsMap).forEach(c => {
          if(c.tempResult && c.tempResult.pVal !== undefined) {
            if(c.tempResult.pVal === maxOpt) { c.tempResult.isCorrect = true; c.tempResult.earnedScore = 1000; }
            const rData = currentRoundData.find(d => d.name === c.playerName);
            if(rData) { rData.isCorrect = c.tempResult.isCorrect; rData.scoreToAdd = c.tempResult.earnedScore; }
          }
        });
      }

      confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 }, colors: ['#fff', '#f1c40f', '#2ecc71'] });
      
      if (qType === 'slider' && gameConfig.useAdvType) {
        document.getElementById('sliderResult').innerText = `精準正解是：${correctAns[0]}！`;
        document.getElementById('sliderResult').style.display = 'block';
        document.getElementById('sliderResult').style.fontSize = 'clamp(40px, 8vh, 100px)';
      } 
      else if ((qType === 'order' || qType === 'match_drag' || qType === 'match_click') && gameConfig.useAdvType) {
        let opts = questions[currentQIndex].options;
        let correctStr = "";
        
        if (qType === 'order') {
            correctStr = qData.correct.map(i => {
                let txt = opts[i];
                return txt.trim().startsWith('http') ? `<img src="${txt.trim()}" style="height:5vh; vertical-align:middle; border-radius:1vh; box-shadow:0 0.2vh 0.5vh rgba(0,0,0,0.3);">` : txt;
            }).join(' ➡️ ');
            document.getElementById('optionsContainer').style.display = 'none'; 
            document.getElementById('sliderResult').style.display = 'block';
            document.getElementById('sliderResult').innerHTML = `<span style="color:#2ecc71; font-size:clamp(30px, 6vh, 70px); font-weight:900;">🎯 正解順序：<br><br>${correctStr}</span>`;
        } else {
            correctStr = currentScrambledCorrect.map(i => {
                let txt = opts[i];
                return txt.trim().startsWith('http') ? `<img src="${txt.trim()}" style="height:5vh; vertical-align:middle; border-radius:1vh; box-shadow:0 0.2vh 0.5vh rgba(0,0,0,0.3);">` : txt;
            }).join(' ➡️ ');
            document.getElementById('matchPromptsContainer').innerHTML = `<h3 style='width:100%; color:#2ecc71; font-size:5vh;'>🎯 正解順序：<br><br>${correctStr}</h3>`;
        }
      } 
      else {
        const options = document.querySelectorAll('.option');
        options.forEach((opt, i) => {
          opt.classList.remove('floating-opt');
          opt.style.animation = 'none'; 
          if(currentMode === 'memory') opt.querySelector('.opt-text').innerText = questions[currentQIndex].options[i];
          
          if (correctAns.includes(i)) opt.classList.add('highlight'); else opt.classList.add('dimmed');
        });
      }

      Object.values(connectionsMap).forEach(conn => {
        if(conn.playerName) {
          const stats = playerStats[conn.playerName];
          if(conn.tempResult) {
            stats.score += conn.tempResult.earnedScore;
            if (conn.tempResult.isCorrect) {
              stats.correctCount++;
              if(currentMode === 'fast_single' || currentMode === 'fast_rank') { stats.fastWins++; stats.fastScore += conn.tempResult.earnedScore; }
              stats.isGhost = false; 
              stats.streak++;
            } else {
              if(gameConfig.useGhost) stats.isGhost = true; 
              stats.streak = 0;
            }

            if(currentMode === 'bounty' && conn.bountyTarget != null) {
              let wagerAmt = parseInt(conn.wager) || 0; 
              let targetFailed = true;
              if(gameConfig.isTeamMode) { Object.values(connectionsMap).forEach(tc => { if(playerStats[tc.playerName]?.teamId == conn.bountyTarget && tc.tempResult?.isCorrect) targetFailed = false; }); } 
              else { let tc = connectionsMap[conn.bountyTarget]; if (tc && tc.tempResult && tc.tempResult.isCorrect) targetFailed = false; }
              if(targetFailed) { stats.score += wagerAmt; conn.send({type:'SKILL_SUCCESS', msg:`賞金獵取成功！+${wagerAmt}分`}); }
              else { stats.score -= wagerAmt; conn.send({type:'SKILL_SUCCESS', msg:`賞金獵取失敗！目標答對了，-${wagerAmt}分`}); }
            }
          } else {
            if(gameConfig.useGhost) stats.isGhost = true;
            stats.streak = 0;
          }
        }
      });

      if(currentMode === 'traitor' && gameConfig.useExtreme && gameConfig.isTeamMode) {
          teamsData.forEach(t => {
              let traitorName = t.players.find(p => playerStats[p].isTraitor);
              if (traitorName) {
                  let traitorData = currentRoundData.find(d => d.name === traitorName);
                  let teammatesWrong = currentRoundData.filter(d => d.name !== traitorName && t.players.includes(d.name) && !d.isCorrect);
                  if (traitorData && !traitorData.isCorrect && teammatesWrong.length > 0) {
                      playerStats[traitorName].score += 500; 
                      teammatesWrong.forEach(tm => { playerStats[tm.name].score -= 200; }); 
                  }
              }
          });
      }

      if(gameConfig.useGhost && gameConfig.isTeamMode) {
        teamsData.forEach(t => {
          let anyCorrect = false;
          t.players.forEach(p => { 
             let c = connectionsMap[p];
             if(c && c.tempResult && c.tempResult.isCorrect) anyCorrect = true; 
          });
          if(anyCorrect) { t.players.forEach(p => playerStats[p].isGhost = false); }
        });
      }

      setTimeout(() => {
        document.getElementById('questionBox').style.display = 'none';
        
        processElimination();
        
        let delay = (gameConfig.useTournament && ((currentQIndex + 1) % gameConfig.tournInterval === 0)) ? 4500 : 0;

      setTimeout(() => {
            if (currentMode.includes('fast_single') || currentMode.includes('fast_rank')) {
                showRoundRanking(currentMode);
            } else {
                document.getElementById('leaderboard').style.display = 'flex'; 
                renderLeaderboard(); 
                document.getElementById('nextBtnLeader').style.display = 'inline-block'; 
                playRoundBGM(); 
            }
        }, delay);

      }, 3000);
    }

    function showRoundRanking(mode) {
      playRoundBGM(); 

      document.getElementById('roundRanking').style.display = 'flex';
      const top3Container = document.getElementById('roundTop3'); top3Container.innerHTML = '';
      document.getElementById('roundTitle').innerText = mode === 'fast_single' ? "⚡ 光速唯一獲勝者！" : "🌟 極速手速前三名";
      const correctPlayers = currentRoundData.filter(d => d.isCorrect).sort((a, b) => a.time - b.time);
      
      if (correctPlayers.length === 0) { top3Container.innerHTML = `<h2 style="width:100%; color:#c0392b;">全軍覆沒！沒人答對 😭</h2>`; return; }

      const displayCount = mode === 'fast_single' ? 1 : 3;
      for(let i=0; i<displayCount; i++) {
        if(correctPlayers[i]) {
          const p = correctPlayers[i]; const timeSec = (p.time / 1000).toFixed(3);
          let rankClass = i === 0 ? 'r-1' : (i === 1 ? 'r-2' : 'r-3'); let medal = i === 0 ? '🥇' : (i === 1 ? '🥈' : '🥉');
          
          let teamTagHtml = "";
          let avatarHtml = `<span style="font-size:5vh; filter: drop-shadow(0 0.2vh 0.2vh rgba(0,0,0,0.2));">${playerStats[p.name].avatar}</span>`;

          if (gameConfig.isTeamMode) {
            const pTeamId = playerStats[p.name].teamId; const tGrad = teamsData.find(t => t.id === pTeamId).gradient;
            teamTagHtml = `<div style="font-size:2vh; margin-bottom:1vh; background:${tGrad}; border-radius:1vh; padding:0.5vh;">${teamsData[pTeamId].name}</div>`;
          }

          top3Container.innerHTML += `
            <div class="r-card ${rankClass}" style="animation-delay: ${i*0.2}s">
              <div style="font-size:4vh; margin-bottom:1vh;">${medal}</div>
              <div style="margin-bottom:0.5vh;">${avatarHtml}</div>
              <div class="r-name">${p.name}</div>
              ${teamTagHtml}
              <div class="r-time">${timeSec}s</div>
            </div>
          `;
          if(i===0) confetti({ particleCount: 100, spread: 80, origin: { y: 0.5 } });
        }
      }
    }

    function showTotalLeaderboard() { 
      document.getElementById('roundRanking').style.display = 'none'; 
      document.getElementById('leaderboard').style.display = 'flex'; 
      renderLeaderboard(); 
      document.getElementById('nextBtnLeader').style.display = 'inline-block'; 
      if (bgmRound && bgmRound.paused) {
         playRoundBGM();
      }
    }

    function renderLeaderboard() {
      const container = document.getElementById('boardContainer'); 
      container.innerHTML = ''; 

      if (gameConfig.isTeamMode) {
          let teamRanks = teamsData.map(t => ({ ...t, score: getTeamScore(t.id) }));
          teamRanks.sort((a, b) => {
              if (a.isEliminated === b.isEliminated) return b.score - a.score;
              return a.isEliminated ? 1 : -1;
          });

          let upperDiv = document.createElement('div');
          upperDiv.style.cssText = "flex: 1; display:flex; flex-direction:column; overflow-y:auto; gap:1vh; border-bottom: 0.4vh dashed rgba(0,0,0,0.1); padding-bottom: 1.5vh;";
          
          teamRanks.forEach((t, index) => {
              let row = document.createElement('div');
              row.className = 'rank-item';
              if (t.isEliminated) row.classList.add('eliminated-item');

              let medal = index === 0 && !t.isEliminated ? "👑" : index === 1 && !t.isEliminated ? "💎" : index === 2 && !t.isEliminated ? "🌟" : (t.isEliminated ? "💀" : "🔥");
              
              let glowClass = '';
              let rankChangeHtml = '';
              let oldScore = t.score;

              if (gameConfig.useAvatarAnim && !t.isEliminated) {
                  if (index === 0) glowClass = 'glow-1';
                  else if (index === 1) glowClass = 'glow-2';
                  else if (index === 2) glowClass = 'glow-3';

                  if (previousTeamRanks[t.name]) {
                      let oldRank = previousTeamRanks[t.name].rank;
                      oldScore = previousTeamRanks[t.name].score;
                      if (oldRank > index) rankChangeHtml = `<span class="rank-change change-up">⬆️ 升 ${oldRank - index}</span>`;
                      else if (oldRank < index) rankChangeHtml = `<span class="rank-change change-down">⬇️ 降 ${index - oldRank}</span>`;
                      else rankChangeHtml = `<span class="rank-change change-same">➖ 持平</span>`;
                  } else {
                      rankChangeHtml = `<span class="rank-change change-new">🆕 新進榜</span>`;
                  }
              }

              if (glowClass) row.classList.add(glowClass);
              row.style.animationDelay = `${index * 0.1}s`;

              let scoreSpanId = `team-score-${t.id}`;
              row.innerHTML = `
                  <span style="display:flex; align-items:center;">
                      ${medal} &nbsp;
                      <span style="background:${t.gradient}; padding:0.5vh 1.5vw; border-radius:1vh; color:white; opacity:${t.isEliminated ? '0.5' : '1'};">${t.name}</span>
                      ${rankChangeHtml}
                  </span> 
                  <span class="rank-score" id="${scoreSpanId}">${oldScore}</span>`;
              upperDiv.appendChild(row);

              if (gameConfig.useAvatarAnim && !t.isEliminated && oldScore !== t.score) {
                  setTimeout(() => animateValue(document.getElementById(scoreSpanId), oldScore, t.score, 1500), 100);
              } else {
                  setTimeout(() => { if(document.getElementById(scoreSpanId)) document.getElementById(scoreSpanId).innerText = t.score; }, 0);
              }
          });

          let lowerDiv = document.createElement('div');
          lowerDiv.style.cssText = "flex: 1.5; display:flex; justify-content:center; gap:1.5vw; overflow-x:auto; padding-top: 1vh;";

          teamsData.forEach(t => {
              let teamCol = document.createElement('div');
              let borderColor = t.gradient.split(',')[1] ? t.gradient.split(',')[1].trim().replace(')','') : '#ccc';
              teamCol.style.cssText = `flex: 1; min-width: 18vw; background: rgba(255,255,255,0.9); border: 0.4vh solid ${borderColor}; border-radius: 2vh; display:flex; flex-direction:column; overflow:hidden; box-shadow: 0 1vh 2vh rgba(0,0,0,0.1); opacity:${t.isEliminated ? '0.5' : '1'};`;
              
              let title = document.createElement('div');
              title.style.cssText = `background: ${t.gradient}; color: white; padding: 1vh; font-size: 2.5vh; font-weight: 900; text-shadow: 0 0.2vh 0.4vh rgba(0,0,0,0.3);`;
              title.innerText = t.name;
              teamCol.appendChild(title);

              let memList = document.createElement('div');
              memList.style.cssText = "flex: 1; overflow-y: auto; padding: 1vh; display:flex; flex-direction:column; gap:0.5vh;";

              let members = t.players.map(pName => {
                  return { name: pName, score: playerStats[pName].score, avatar: playerStats[pName].avatar, isEliminated: playerStats[pName].isEliminated, streak: playerStats[pName].streak };
              });
              members.sort((a,b) => b.score - a.score);

              members.forEach((m, mIdx) => {
                  let memRow = document.createElement('div');
                  memRow.style.cssText = `display:flex; justify-content:space-between; align-items:center; padding: 0.8vh 1vw; background: ${mIdx%2===0 ? 'rgba(0,0,0,0.03)' : '#fff'}; border-radius: 1vh; font-size: clamp(14px, 2.2vh, 24px); font-weight: bold; ${m.isEliminated ? 'text-decoration:line-through; color:#aaa;' : 'color:#333;'}`;
                  
                  let oldPScore = m.score;
                  if (gameConfig.useAvatarAnim && previousPlayerRanks[m.name]) {
                      oldPScore = previousPlayerRanks[m.name].score;
                  }

                  let pScoreId = `mem-score-${m.name.replace(/[^a-zA-Z0-9]/g, '')}-${mIdx}`;
                  let streakIcon = m.streak >= 2 && !m.isEliminated ? `<span style="font-size:1.8vh; color:#e74c3c;">🔥</span>` : '';

                  memRow.innerHTML = `<span style="display:flex; align-items:center; gap:0.5vw;"><span style="font-size:3vh; filter:drop-shadow(0 0.1vh 0.1vh rgba(0,0,0,0.2));">${m.avatar}</span> <span style="max-width: 8vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${m.name}</span> ${streakIcon}</span> <span style="color:#ff4b2b; font-family:monospace; font-size: clamp(16px, 2.5vh, 28px);" id="${pScoreId}">${oldPScore}</span>`;
                  memList.appendChild(memRow);

                  if (gameConfig.useAvatarAnim && !m.isEliminated && oldPScore !== m.score) {
                      setTimeout(() => animateValue(document.getElementById(pScoreId), oldPScore, m.score, 1500), 100);
                  } else {
                      setTimeout(() => { if(document.getElementById(pScoreId)) document.getElementById(pScoreId).innerText = m.score; }, 0);
                  }
              });
              
              teamCol.appendChild(memList);
              lowerDiv.appendChild(teamCol);
          });

          container.appendChild(upperDiv);
          container.appendChild(lowerDiv);

          previousTeamRanks = {};
          teamRanks.forEach((t, idx) => previousTeamRanks[t.name] = { rank: idx, score: t.score });
          previousPlayerRanks = {};
          Object.keys(playerStats).forEach(pName => previousPlayerRanks[pName] = { score: playerStats[pName].score });

      } else {
          let rankedData = Object.keys(playerStats).map(pName => { return { name: pName, score: playerStats[pName].score, avatar: playerStats[pName].avatar, isEliminated: playerStats[pName].isEliminated, streak: playerStats[pName].streak, isGhost: playerStats[pName].isGhost }; }); 
          
          rankedData.sort((a, b) => {
              if (a.isEliminated === b.isEliminated) return b.score - a.score;
              return a.isEliminated ? 1 : -1;
          });

          let ul = document.createElement('ul');
          ul.id = 'scoreList'; 
          container.appendChild(ul);

          rankedData.slice(0, 10).forEach((item, index) => {
              let li = document.createElement('li'); 
              li.className = 'rank-item'; 
              li.style.animationDelay = `${index * 0.1}s`;
              
              if (item.isEliminated) li.classList.add('eliminated-item');

              let medal = index === 0 && !item.isEliminated ? "👑" : index === 1 && !item.isEliminated ? "💎" : index === 2 && !item.isEliminated ? "🌟" : (item.isEliminated ? "💀" : "🔥");
              
              let glowClass = '';
              let rankChangeHtml = '';
              let oldScore = item.score;

              if (gameConfig.useAvatarAnim && !item.isEliminated) {
                  if (index === 0) glowClass = 'glow-1';
                  else if (index === 1) glowClass = 'glow-2';
                  else if (index === 2) glowClass = 'glow-3';

                  if (previousPlayerRanks[item.name]) {
                      let oldRank = previousPlayerRanks[item.name].rank;
                      oldScore = previousPlayerRanks[item.name].score;
                      if (oldRank > index) rankChangeHtml = `<span class="rank-change change-up">⬆️ 升 ${oldRank - index}</span>`;
                      else if (oldRank < index) rankChangeHtml = `<span class="rank-change change-down">⬇️ 降 ${index - oldRank}</span>`;
                      else rankChangeHtml = `<span class="rank-change change-same">➖ 持平</span>`;
                  } else {
                      rankChangeHtml = `<span class="rank-change change-new">🆕 新進榜</span>`;
                  }
              }

              if (glowClass) li.classList.add(glowClass);

              let streakHtml = ''; let ghostHtml = '';
              if(item.streak >= 2 && !item.isEliminated) streakHtml = `<span class="player-tag fire-streak" style="font-size:2vh; padding: 0.5vh 1vw;">🔥 x${item.streak}</span>`;
              if(item.isGhost) ghostHtml = ` <span style="font-size:3vh;">👻</span>`;
              
              let avatarHtml = `<span style="font-size:4vh; margin-right:1vw; filter: drop-shadow(0 0.2vh 0.2vh rgba(0,0,0,0.2));">${item.avatar}</span>`;
              
              let scoreSpanId = `indiv-score-${index}`;
              li.innerHTML = `<span style="display:flex; align-items:center;">${medal} &nbsp;${avatarHtml}${item.name} ${streakHtml} ${ghostHtml} ${rankChangeHtml}</span> <span class="rank-score" id="${scoreSpanId}">${oldScore}</span>`;
              ul.appendChild(li);

              if (gameConfig.useAvatarAnim && !item.isEliminated && oldScore !== item.score) {
                  setTimeout(() => animateValue(document.getElementById(scoreSpanId), oldScore, item.score, 1500), 100);
              } else {
                  setTimeout(() => { if(document.getElementById(scoreSpanId)) document.getElementById(scoreSpanId).innerText = item.score; }, 0);
              }
          });

          previousPlayerRanks = {};
          rankedData.forEach((item, index) => {
              previousPlayerRanks[item.name] = { rank: index, score: item.score };
          });
      }
    }

    function showTeamPodium() {
      playPodiumBGM(); 
      playWin(); 
      document.body.className = "bg-podium";
      document.getElementById('questionBox').style.display = 'none'; document.getElementById('leaderboard').style.display = 'none';
      
      let finalData = []; let titleText = "";

      if (gameConfig.isTeamMode) {
        finalData = teamsData.map(t => {
          let tScore=0, tCorrect=0, tFastWin=0, tFastScore=0;
          t.players.forEach(p => { tScore += playerStats[p].score; tCorrect += playerStats[p].correctCount; tFastWin += playerStats[p].fastWins; tFastScore += playerStats[p].fastScore; });
          let pCount = Math.max(1, t.players.length);
          return { name: t.name, metric: 0, display: "", raw: {tScore, tCorrect, tFastWin, tFastScore, pCount}, isEliminated: t.isEliminated };
        });
        const mode = gameConfig.winMode; 
        finalData.forEach(t => {
          if(mode === "1") { t.metric = t.raw.tScore; t.display = `${t.metric} 分`; titleText="聯盟總積分冠軍"; }
          if(mode === "2") { t.metric = t.raw.tCorrect; t.display = `答對 ${t.metric} 題`; titleText="聯盟答對數冠軍"; }
          if(mode === "3") { t.metric = Math.floor(t.raw.tScore / t.raw.pCount); t.display = `平均 ${t.metric} 分`; titleText="聯盟平均分冠軍"; }
          if(mode === "4") { t.metric = (t.raw.tCorrect / t.raw.pCount).toFixed(1); t.display = `平均答對 ${t.metric} 題`; titleText="精英聯盟冠軍"; }
          if(mode === "5") { t.metric = t.raw.tFastWin; t.display = `神手 ${t.metric} 次`; titleText="閃電神手聯盟"; }
          if(mode === "6") { t.metric = t.raw.tFastScore; t.display = `搶答 ${t.metric} 分`; titleText="極速搶分聯盟"; }
        });
      } else {
        titleText = "個人總積分冠軍";
        finalData = Object.keys(playerStats).map(pName => { return { name: pName, metric: playerStats[pName].score, display: `${playerStats[pName].score} 分`, avatar: playerStats[pName].avatar, isEliminated: playerStats[pName].isEliminated }; });
      }

      finalData.sort((a, b) => {
          if (a.isEliminated === b.isEliminated) return b.metric - a.metric;
          return a.isEliminated ? 1 : -1;
      });

      document.getElementById('podiumTitle').innerText = `🏆 ${titleText} 🏆`; document.getElementById('podiumContainer').style.display = 'flex';
      for(let i=0; i<3; i++) {
        const place = i+1;
        if(finalData[i] && finalData[i].metric > 0 && !finalData[i].isEliminated) { 
           let avatarHtml = gameConfig.isTeamMode ? "" : `<div style="font-size:10vh; margin-bottom:1.5vh; filter: drop-shadow(0 0.5vh 0.5vh rgba(0,0,0,0.3));">${finalData[i].avatar}</div>`;
           document.getElementById(`name-${place}`).innerHTML = `${avatarHtml}${finalData[i].name}`; 
           document.getElementById(`score-${place}`).innerText = finalData[i].display; 
        } 
        else { document.getElementById(`name-${place}`).innerText = "無"; document.getElementById(`score-${place}`).innerText = "-"; }
      }
      var duration = 15 * 1000; var end = Date.now() + duration;
      (function frame() {
        confetti({ particleCount: 10, angle: 60, spread: 80, origin: { x: -0.1 }, colors: ['#f1c40f', '#e74c3c', '#3498db'] });
        confetti({ particleCount: 10, angle: 120, spread: 80, origin: { x: 1.1 }, colors: ['#f1c40f', '#e74c3c', '#3498db'] });
        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    }
  </script>
</body>
</html>
