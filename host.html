<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>P2P 主畫面 - 派對實境秀終極版</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  
  <style id="dynamicTeamStyles"></style>

  <style>
    /* ========== 動態流光背景 ========== */
    body { font-family: 'Nunito', sans-serif; text-align: center; margin: 0; padding: 20px; color: #fff; overflow-x: hidden; min-height: 100vh; transition: background 0.5s; background-size: 300% 300%; }
    .bg-setup { background-image: linear-gradient(135deg, #667eea, #764ba2); }
    .bg-lobby { background-image: linear-gradient(45deg, #ff9a9e, #fecfef, #a18cd1, #fbc2eb); animation: fluidBg 8s ease infinite; }
    .bg-question { background-image: linear-gradient(45deg, #1fa2ff, #12d8fa, #a6ffcb); animation: fluidBg 6s ease infinite; color: #111;}
    .bg-fast { background-image: repeating-linear-gradient(45deg, #f1c40f, #f1c40f 20px, #e67e22 20px, #e67e22 40px); animation: feverBg 1s linear infinite; color: #111; box-shadow: inset 0 0 50px #d35400;}
    .bg-wager { background-image: linear-gradient(45deg, #2c3e50, #000000); color: #f1c40f; animation: fluidBg 5s ease infinite; }
    .bg-reveal { background-image: linear-gradient(45deg, #11998e, #38ef7d, #00b09b, #96c93d); animation: fluidBg 4s ease infinite; }
    .bg-podium { background-color: #f1c40f; overflow: hidden; position: relative;}
    .bg-shuffle { background: repeating-radial-gradient(circle, #8e44ad, #8e44ad 20px, #9b59b6 20px, #9b59b6 40px); animation: spinBg 4s linear infinite; }
    .bg-traitor { background-image: repeating-radial-gradient(circle, #000, #333 10%); animation: fluidBg 3s ease infinite; color: #fff;}
    
    @keyframes fluidBg { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }
    @keyframes feverBg { 0% {background-position: 0% 0%;} 100% {background-position: 100% 100%;} }
    @keyframes spinBg { from { background-position: 0 0; } to { background-position: 100px 100px; } }

    /* ========== 警告與大風吹動畫 ========== */
    #eventWarning { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
    .warning-text { font-size: 120px; font-weight: 900; color: #f1c40f; text-shadow: 0 0 30px #f39c12, 0 10px 0 #d35400; animation: flashText 0.3s infinite alternate; }
    .shuffle-anim { animation: spinAndZoom 1.5s ease-in-out infinite alternate !important; color: #e056fd; text-shadow: 0 0 40px #be2edd, 0 10px 0 #686de0;}
    @keyframes flashText { from { transform: scale(1); } to { transform: scale(1.1); color: #fff; } }
    @keyframes spinAndZoom { 0% { transform: scale(0.8) rotate(-5deg); } 100% { transform: scale(1.2) rotate(5deg); color: #fff;} }

    /* ========== UI 面板 ========== */
    .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 30px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.15), inset 0 0 0 5px rgba(255,255,255,0.5); margin: 20px auto; width: 85%; color: #333; animation: popUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popUp { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    
    .panel-shake { animation: boxShake 0.4s infinite !important; }
    @keyframes boxShake { 0%, 100% { transform: translateX(0) rotate(0deg); } 25% { transform: translateX(-4px) rotate(-1deg); } 75% { transform: translateX(4px) rotate(1deg); } }

    .setup-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.05); padding: 10px 15px; border-radius: 15px;}
    .setup-input, .setup-select { font-size: 18px; padding: 5px; border-radius: 10px; border: 2px solid #ccc; font-weight: bold; font-family: inherit;}

    /* ========== 大廳與隨機變形果凍名牌 ========== */
    #teamBuckets { display: flex; justify-content: space-around; margin-top: 20px; flex-wrap: wrap; gap: 15px;}
    .team-bucket { flex: 1 1 calc(25% - 15px); min-width: 150px; min-height: 200px; border-radius: 20px; padding: 15px; color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: 0.3s; }
    .team-title { font-size: 24px; font-weight: 900; margin-bottom: 10px; border-bottom: 3px solid rgba(255,255,255,0.5); padding-bottom: 5px; text-shadow: 1px 1px 3px rgba(0,0,0,0.3);}
    
    .player-tag { 
      color: #333; font-size: 22px; padding: 12px 25px; margin: 10px; 
      display: inline-flex; align-items: center; gap: 8px; font-weight: 900; 
      box-shadow: 0 8px 15px rgba(0,0,0,0.15), inset 0 -4px 5px rgba(0,0,0,0.1); 
      border: 3px solid rgba(255,255,255,0.6); 
    }
    @keyframes jellyTag {
      0%, 100% { transform: scale(1, 1) rotate(0deg); }
      25% { transform: scale(1.05, 0.95) rotate(3deg); }
      50% { transform: scale(0.95, 1.05) rotate(-3deg); }
      75% { transform: scale(1.02, 0.98) rotate(1deg); }
    }
    @keyframes superBounceTag { 
      0% { transform: scale(0) translateY(100px); opacity:0; } 
      60% { transform: scale(1.1) translateY(-10px); opacity:1; }
      100% { transform: scale(1) translateY(0); opacity:1; } 
    }
    
    .fire-streak { box-shadow: 0 0 10px #e74c3c, 0 0 20px #f1c40f !important; border: 2px solid #e74c3c !important; } 
    .ghost-tag { opacity: 0.5; filter: grayscale(100%); text-decoration: line-through; }

    /* ========== 深色高對比大廳倒數計時器 ========== */
    .lobby-timer-box { font-size: 36px; font-weight: 900; color: #4a3472; margin-top: 15px; background: rgba(255,255,255,0.95); padding: 15px 40px; border-radius: 50px; box-shadow: 0 15px 25px rgba(0,0,0,0.2); display: inline-block; border: 5px solid #f1c40f; }
    #groupTimerText { color: #c0392b; font-size: 80px; display: inline-block; animation: lobbyTimerPulse 0.8s infinite cubic-bezier(0.175, 0.885, 0.32, 1.275); text-shadow: 0 4px 10px rgba(192,57,43,0.3); margin: 0 15px;}
    @keyframes lobbyTimerPulse { 
      0% { transform: scale(1); color: #c0392b; } 
      50% { transform: scale(1.25) rotate(5deg); color: #900C3F; } 
      100% { transform: scale(1); color: #c0392b; } 
    }

    #headerContainer { display: inline-flex; justify-content: center; align-items: center; gap: 40px; margin-bottom: 20px;}
    #qrcode { background: white; padding: 15px; border-radius: 20px; border: 6px dashed #ff6b6b; transform: rotate(-3deg);}
    
    h2 { font-size: 42px; margin-top: 0; line-height: 1.3;}
    .mode-badge { background: linear-gradient(45deg, #f093fb, #f5576c); color: white; padding: 8px 20px; border-radius: 30px; font-size: 24px; vertical-align: middle; margin-left: 15px; box-shadow: 0 5px 0 #c0392b;}
    
    #qMedia { max-height: 300px; max-width: 100%; border-radius: 15px; display: none; margin: 10px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.2); border: 5px solid white;}
    .fog-anim { animation: fogClear var(--fog-time) linear forwards; }
    @keyframes fogClear { 0% { filter: blur(30px); } 100% { filter: blur(0px); } }

    #matchPromptsContainer { display: none; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
    .match-prompt-item { width: 45%; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; position: relative;}
    .match-prompt-item img { max-width: 100%; max-height: 180px; border-radius: 10px; }
    .match-badge { position: absolute; top: -15px; left: -15px; background: #e74c3c; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 5px 10px rgba(0,0,0,0.3); z-index: 5;}

    #optionsContainer { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; margin-top: 20px; }
    .option { width: calc(50% - 15px); padding: 20px; font-size: 32px; font-weight: 900; color: white; border-radius: 25px; box-shadow: 0 10px 0 rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: flex-start; gap: 20px;}
    
    .color-0 { background: linear-gradient(135deg, #ff416c, #ff4b2b); box-shadow: 0 10px 0 #b32a18;} 
    .color-1 { background: linear-gradient(135deg, #0072ff, #00c6ff); box-shadow: 0 10px 0 #0056b3;} 
    .color-2 { background: linear-gradient(135deg, #f9d423, #ff4e50); box-shadow: 0 10px 0 #b33200;} 
    .color-3 { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 10px 0 #0e7a5c;}
    .color-4 { background: linear-gradient(135deg, #8e44ad, #9b59b6); box-shadow: 0 10px 0 #732d91;}
    .color-5 { background: linear-gradient(135deg, #e67e22, #f39c12); box-shadow: 0 10px 0 #d35400;}
    .color-6 { background: linear-gradient(135deg, #2c3e50, #34495e); box-shadow: 0 10px 0 #1a252f;}
    .color-7 { background: linear-gradient(135deg, #e84393, #fd79a8); box-shadow: 0 10px 0 #b33971;}

    .floating-opt { animation: floatOpt 3s ease-in-out infinite; }
    @keyframes floatOpt { 0%, 100% { transform: translateY(0px) rotate(0deg); } 33% { transform: translateY(-8px) rotate(1deg); } 66% { transform: translateY(5px) rotate(-1deg); } }

    .option.dimmed { opacity: 0.2; transform: scale(0.9); filter: grayscale(100%) blur(2px); animation: none !important;}
    .option.highlight { 
        transform: scale(1.15) !important; 
        box-shadow: 0 0 60px rgba(255, 215, 0, 1), 0 15px 0 rgba(0,0,0,0.3) !important; 
        border: 6px solid #FFD700; z-index: 20; 
        animation: winnerSuperPulse 0.8s infinite alternate !important;
        background: linear-gradient(135deg, #f1c40f, #f39c12) !important;
        color: #000; text-shadow: 0 2px 5px rgba(255,255,255,0.8);
    }
    @keyframes winnerSuperPulse { 0% { transform: scale(1.15); box-shadow: 0 0 40px rgba(255,215,0,0.8); } 100% { transform: scale(1.25); box-shadow: 0 0 80px rgba(255,215,0,1); } }

    #sliderResult { display: none; font-size: 48px; font-weight: 900; color: #2ecc71; margin-top: 20px; background: rgba(255,255,255,0.9); padding: 10px 30px; border-radius: 20px;}

    #timeBarContainer { width: 100%; height: 25px; background: #eee; border-radius: 20px; margin: 20px 0; overflow: hidden; box-shadow: inset 0 5px 10px rgba(0,0,0,0.1);}
    #timeBar { height: 100%; width: 100%; background: linear-gradient(90deg, #00c6ff, #0072ff); transition: width 1s linear, background 0.5s; }
    
    #timerText { font-size: 80px; font-weight: 900; margin: 0; line-height: 1; text-shadow: 2px 2px 0 #fff; display: inline-block;}
    .tick-anim { animation: elasticTick 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes elasticTick { 0% { transform: scale(0.8); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
    
    .panic-timer { animation: panicTick 0.3s infinite alternate !important; color: #ff3f34 !important; text-shadow: 0 0 30px #ff3f34, 0 5px 0 #8a0b0b !important; }
    @keyframes panicTick { 0% { transform: scale(1.4) rotate(-3deg); } 100% { transform: scale(1.7) rotate(3deg); } }
    
    .ctrl-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px 50px; font-size: 32px; font-weight: 900; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 0 #4a3472; transition: 0.2s; font-family: inherit; margin-top:20px;}
    .ctrl-btn:active { transform: translateY(10px); box-shadow: 0 0 0 #4a3472; }

    #roundRanking, #leaderboard, #podiumContainer { display: none; }
    #roundRanking { background: rgba(255,255,255,0.95); border-radius: 30px; padding: 40px; margin: 20px auto; width: 85%; box-shadow: 0 20px 50px rgba(0,0,0,0.3); color: #333; animation: popUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
    .round-top3 { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; align-items: flex-end; height: 250px;}
    .r-card { background: linear-gradient(135deg, #f6d365, #fda085); border-radius: 20px; padding: 20px; width: 30%; color: white; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.2); animation: riseUp 0.8s both;}
    .r-card.r-1 { transform: scale(1.15); z-index: 3; background: linear-gradient(135deg, #ff0844, #ffb199); border: 4px solid #fff; box-shadow: 0 0 30px rgba(255,8,68,0.5);}
    .r-card.r-2 { transform: scale(1); z-index: 2; background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
    .r-card.r-3 { transform: scale(0.9); z-index: 1; background: linear-gradient(135deg, #84fab0, #8fd3f4); }
    .r-name { font-size: 36px; font-weight: 900; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);}
    .r-time { font-size: 42px; font-family: monospace; font-weight: 900; background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 15px;}
    
    #scoreList { list-style: none; padding: 0; }
    .rank-item { background: linear-gradient(90deg, #fff, #f8f9fa); margin: 15px 0; padding: 15px 25px; border-radius: 20px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; font-size: 32px; border-left: 8px solid #ff4b2b; animation: slideInLeft 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
    @keyframes slideInLeft { from { transform: translateX(-100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .rank-score { color: #ff4b2b; font-family: monospace; font-size: 42px; font-weight: 900;}

    #podiumContainer { flex-direction: row; justify-content: center; align-items: flex-end; height: 550px; gap: 30px; margin-top: 50px;}
    .podium-place { display: flex; flex-direction: column; align-items: center; width: 25%; animation: riseUp 1.2s forwards;}
    @keyframes riseUp { from { transform: translateY(150%); opacity: 0;} to { transform: translateY(0); opacity: 1;} }
    .podium-name { font-size: 42px; font-weight: 900; color: white; margin-bottom: 15px; text-shadow: 0 4px 10px rgba(0,0,0,0.5);}
    .podium-score { font-size: 28px; color: #fff; background: rgba(0,0,0,0.5); padding: 8px 20px; border-radius: 30px; margin-bottom: 15px;}
    .podium-block { width: 100%; border-radius: 20px 20px 0 0; display: flex; justify-content: center; font-size: 80px; font-weight: 900; color: rgba(255,255,255,0.9); padding-top: 30px; box-shadow: inset 0 20px 30px rgba(255,255,255,0.4), 0 10px 20px rgba(0,0,0,0.5);}
    .place-1 .podium-block { height: 350px; background: linear-gradient(to bottom, #FFD700, #F39C12); }
    .place-2 .podium-block { height: 250px; background: linear-gradient(to bottom, #E0E0E0, #95A5A6); }
    .place-3 .podium-block { height: 180px; background: linear-gradient(to bottom, #CD7F32, #A0522D); }

    /* ========== 答題即時進場區 ========== */
    #answeredContainer {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 3px dashed rgba(0,0,0,0.1);
      min-height: 80px;
    }
    #answeredCountTitle {
      font-size: 22px; font-weight: 900; color: #555; margin: 0 0 10px 0;
    }
    #answeredGrid {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    }
    .answered-tag {
      font-size: 18px; padding: 5px 15px; border-radius: 30px;
      background: rgba(255,255,255,0.9); color: #333; font-weight: 900;
      box-shadow: 0 5px 10px rgba(0,0,0,0.15);
      display: inline-flex; align-items: center; gap: 6px;
      animation: popInAnswer 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transform: scale(0);
    }
    /* 前三名的專屬炫耀樣式 */
    .answered-tag.top-1 { border: 3px solid #f1c40f; background: #fffdf0; transform: scale(1.15) !important; z-index: 3; }
    .answered-tag.top-2 { border: 3px solid #bdc3c7; transform: scale(1.05) !important; z-index: 2; }
    .answered-tag.top-3 { border: 3px solid #cd7f32; transform: scale(1.0) !important; z-index: 1; }

    @keyframes popInAnswer {
      0% { transform: scale(0) translateY(30px); opacity: 0; }
      80% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="bg-setup">
  
  <div id="eventWarning">
    <div class="warning-text" id="warningTitle">⚡ 閃電搶答 ⚡</div>
    <div style="font-size: 40px; color: #fff; margin-top:20px; font-weight:bold;" id="warningSub"></div>
  </div>

  <div id="setupScreen" class="glass-panel" style="max-width: 1000px;">
    <h2 style="color: #4a3472; font-size: 48px; margin-bottom: 20px;">⚙️ 建立終極派對聯賽</h2>
    
    <div style="display:flex; gap:30px; text-align:left;">
      <div style="flex:1;">
        <h3 style="margin-top:0; color:#e67e22;">👥 基礎賽制設定</h3>
        <div class="setup-row"><span>模式：</span><select id="cfgMode" class="setup-select" onchange="toggleTeamInputs()"><option value="individual">👑 個人戰 (不分組)</option><option value="teams" selected>🛡️ 聯盟對抗</option></select></div>
        <div id="teamOptionsBox">
          <div class="setup-row"><span>分組數：</span><input type="number" id="cfgTeams" class="setup-input" value="4" min="2" style="width: 60px;"></div>
          <div class="setup-row"><span>每隊人數：</span><input type="number" id="cfgMax" class="setup-input" value="10" min="1" style="width: 60px;"></div>
          <div class="setup-row" style="background: rgba(155, 89, 182, 0.2); border-left: 5px solid #8e44ad;">
            <span>🌀 大風吹 (第幾題後，0為關閉)：</span><input type="number" id="cfgShuffle" class="setup-input" value="0" min="0" style="width: 80px; text-align:center;">
          </div>
        </div>
        <div class="setup-row"><span>等候秒數：</span><input type="number" id="cfgTime" class="setup-input" value="60" min="10" style="width: 60px;"></div>
        <div class="setup-row">
          <span>🏆 條件：</span>
          <select id="cfgWin" class="setup-select" style="font-size:16px;">
            <option value="1">1. 總積分最高</option><option value="2">2. 總答對數最高</option><option value="3">3. 隊員平均分最高</option>
            <option value="4">4. 隊員平均答對數</option><option value="5">5. 閃電成功數最高</option><option value="6">6. 閃電搶分最高</option>
          </select>
        </div>
      </div>
      
      <div style="flex:1; background: rgba(46, 204, 113, 0.2); border-left: 5px solid #2ecc71; padding: 20px; border-radius: 15px;">
        <h3 style="margin-top:0; color:#27ae60;">🔥 七大神級擴充模組</h3>
        <label style="display:flex; align-items:center; margin: 10px 0; font-size: 18px; cursor:pointer;"><input type="checkbox" id="cfgMedia" checked style="width:20px; height:20px; margin-right:10px;"> 👁️ 迷霧解析 & 多媒體圖片</label>
        <label style="display:flex; align-items:center; margin: 10px 0; font-size: 18px; cursor:pointer;"><input type="checkbox" id="cfgAdvType" checked style="width:20px; height:20px; margin-right:10px;"> 🧩 進階題型 (連連看/拉桿/排序)</label>
        <label style="display:flex; align-items:center; margin: 10px 0; font-size: 18px; cursor:pointer;"><input type="checkbox" id="cfgEconomy" checked style="width:20px; height:20px; margin-right:10px;"> 💰 賞金獵人 & 盲注 & 連對加成</label>
        <label style="display:flex; align-items:center; margin: 10px 0; font-size: 18px; cursor:pointer;"><input type="checkbox" id="cfgSabotage" checked style="width:20px; height:20px; margin-right:10px;"> ⚔️ 戰術干擾 (冰凍/洗牌/50-50/護盾)</label>
        <label style="display:flex; align-items:center; margin: 10px 0; font-size: 18px; cursor:pointer;"><input type="checkbox" id="cfgGhost" checked style="width:20px; height:20px; margin-right:10px;"> ☠️ 靈魂急救 (生存依賴模式)</label>
        <label style="display:flex; align-items:center; margin: 10px 0; font-size: 18px; cursor:pointer;"><input type="checkbox" id="cfgExtreme" checked style="width:20px; height:20px; margin-right:10px;"> ⚖️ 極限心理戰 (背叛者/拍賣/地雷/閃憶)</label>
      </div>
    </div>
    <button class="ctrl-btn" onclick="initLobby()" style="margin-top: 30px; width: 80%;">產生遊戲大廳 🚀</button>
  </div>

  <div id="lobbyScreen" class="glass-panel" style="display:none; width: 95%;">
    <div style="display: flex; justify-content: center; align-items: center; gap: 30px;">
      <div id="qrcode"></div>
      <div style="text-align: left;">
        <h2 style="color:#ff4b2b; margin:0; text-shadow: 0 4px 10px rgba(0,0,0,0.1);" id="lobbyWaitText">✨ 掃描 QR Code 選擇陣營！</h2>
        <div class="lobby-timer-box" id="lobbyTimerBox">
          倒數開始遊戲：<span id="groupTimerText">60</span> 秒
        </div>
      </div>
    </div>
    <div id="teamBuckets"></div>

      <div id="answeredCountTitle">⚡ 已完成作答 <span id="answeredCount">0</span> 人 ⚡</div>

  <div id="podiumContainer">
    <h1 style="position: absolute; top: -100px; width: 100%; text-align: center; color: white; font-size: 60px; text-shadow: 0 5px 15px rgba(0,0,0,0.5);" id="podiumTitle">🏆 總冠軍 🏆</h1>
    <div class="podium-place place-2" style="order: 1;"><div class="podium-score" id="score-2"></div><div class="podium-name" id="name-2"></div><div class="podium-block">2</div></div>
    <div class="podium-place place-1" style="order: 2; z-index: 2;"><div class="podium-score" id="score-1"></div><div class="podium-name" id="name-1"></div><div class="podium-block">1</div></div>
    <div class="podium-place place-3" style="order: 3;"><div class="podium-score" id="score-3"></div><div class="podium-name" id="name-3"></div><div class="podium-block">3</div></div>
  </div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSChl0vRMFeEVPH4K5T8OC6R4EXWDsoqwJA68DQxQc58IH1zxaG-A1uly4lZT1jr6x8rJIMGPjJ0vRU/pub?output=csv"; 

    // ========== 柔和化音樂與真實 BGM 引擎 ==========
    let audioCtx;
    const bgmNormal = new Audio('https://assets.mixkit.co/music/preview/mixkit-funny-quirky-comedy-track-71.mp3'); 
    bgmNormal.loop = true; bgmNormal.volume = 0.3;
    const bgmFast = new Audio('https://assets.mixkit.co/music/preview/mixkit-clapping-comedy-background-music-260.mp3'); 
    bgmFast.loop = true; bgmFast.volume = 0.4;
    let currentBGM = null;

    function initAudio() { 
      if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); } 
    }
    
    function startBGM(type) {
        stopBGM();
        currentBGM = type === 'fast' ? bgmFast : bgmNormal;
        currentBGM.play().catch(e => console.log("等待互動以播放 BGM"));
    }
    
    function stopBGM() {
        if(bgmNormal) { bgmNormal.pause(); bgmNormal.currentTime = 0; }
        if(bgmFast) { bgmFast.pause(); bgmFast.currentTime = 0; }
    }

    function playTone(freq, type, duration, vol=0.1) { 
      if(!audioCtx) return; 
      const osc = audioCtx.createOscillator(); 
      const gain = audioCtx.createGain(); 
      osc.type = type; 
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime); 
      gain.gain.setValueAtTime(vol, audioCtx.currentTime); 
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration); 
      osc.connect(gain); gain.connect(audioCtx.destination); 
      osc.start(); osc.stop(audioCtx.currentTime + duration); 
    }
    // 俏皮的泡泡破裂音效，頻率隨機產生些微變化，聽起來才不會死板
    function playPopSound() { 
      initAudio(); 
      const randomFreq = 800 + Math.random() * 400; // 800Hz ~ 1200Hz
      playTone(randomFreq, 'sine', 0.05, 0.08); 
    }
    function playJoin() { initAudio(); playTone(600, 'sine', 0.1); setTimeout(()=>playTone(800, 'sine', 0.15), 100); } 
    function playStart() { initAudio(); playTone(523, 'triangle', 0.1); setTimeout(() => playTone(659, 'triangle', 0.1), 150); setTimeout(() => playTone(784, 'triangle', 0.4), 300); }
    function playWarning() { initAudio(); playTone(400, 'sine', 0.2, 0.2); setTimeout(()=>playTone(500, 'sine', 0.3, 0.2), 200); } 
    function playShuffleSound() { initAudio(); playTone(300, 'triangle', 0.1); setTimeout(()=>playTone(400, 'triangle', 0.1), 100); setTimeout(()=>playTone(500, 'triangle', 0.1), 200); setTimeout(()=>playTone(600, 'triangle', 0.1), 300); setTimeout(()=>playTone(800, 'triangle', 0.5), 400); }
    function playTickFast() { initAudio(); playTone(800, 'sine', 0.1, 0.05); } 
    function playTick() { initAudio(); playTone(600, 'sine', 0.1, 0.05); } 
    function playReveal() { initAudio(); playTone(659, 'sine', 0.1); setTimeout(() => playTone(1046, 'sine', 0.5), 100); } 
    function playWin() { initAudio(); playTone(523, 'triangle', 0.1); setTimeout(() => playTone(659, 'triangle', 0.1), 100); setTimeout(() => playTone(783, 'triangle', 0.1), 200); setTimeout(() => playTone(1046, 'triangle', 0.6), 300); }
    function playFirstBlood() { initAudio(); playTone(880, 'triangle', 0.1); setTimeout(() => playTone(1108, 'triangle', 0.1), 100); setTimeout(() => playTone(1318, 'triangle', 0.4), 200); } 

    function toggleTeamInputs() {
      const mode = document.getElementById('cfgMode').value;
      document.getElementById('teamOptionsBox').style.display = mode === 'teams' ? 'block' : 'none';
    }

    let questions = []; let currentQIndex = -1; let countdownInterval; let isAcceptingAnswers = false;
    let connections = []; let answeredPlayers = new Set(); let questionStartTime = 0;
    
    let gameConfig = {}; let teamsData = []; let playerStats = {}; 
    let currentRoundData = []; let groupTimerInterval;
    let currentScrambledCorrect = []; 
    let highestBidder = null; let highestBid = 0;
    const shapeList = ['▲','◆','●','■','★','✚','✦','✖','▼','⬣'];

    const roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
    let peer;

    // 隨機果凍名牌生成器
    function createPlayerTagElement(name, avatar, idStr = "") {
      const tag = document.createElement('div'); 
      tag.className = 'player-tag'; 
      if(idStr) tag.id = idStr;
      tag.innerHTML = `<span style="font-size:28px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));">${avatar}</span> <span style="text-shadow: 0 1px 2px rgba(255,255,255,0.8);">${name}</span>`;
      
      const blobs = [
        '30% 70% 70% 30% / 30% 30% 70% 70%', '60% 40% 30% 70% / 60% 30% 70% 40%',
        '40% 60% 70% 30% / 40% 50% 60% 50%', '70% 30% 40% 60% / 50% 70% 30% 50%',
        '50% 50% 20% 80% / 25% 80% 20% 75%', '30px', '40px'
      ];
      const colors = [
        'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)', 'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)',
        'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)', 'linear-gradient(135deg, #cfd9df 0%, #e2ebf0 100%)',
        'linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)', 'linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)',
        'linear-gradient(135deg, #fccb90 0%, #d57eeb 100%)', 'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)',
        'linear-gradient(135deg, #ff0844 0%, #ffb199 100%)', 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
        'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)', 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)'
      ];
      
      tag.style.borderRadius = blobs[Math.floor(Math.random() * blobs.length)];
      tag.style.background = colors[Math.floor(Math.random() * colors.length)];
      const animDelay = (Math.random() * 0.5).toFixed(2);
      const animDur = (2 + Math.random()).toFixed(2);
      tag.style.animation = `superBounceTag 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both, jellyTag ${animDur}s infinite ease-in-out alternate ${animDelay}s`;
      
      return tag;
    }

    function generateTeamStyles(count) {
      let cssString = ""; teamsData = [];
      const emojis = ['🔥','🌊','⚡','🌲','💫','🔮','💎','🌋','🌀','🪐','🌪️','☄️'];
      const names = ['赤焰','冰霜','閃電','森林','幻星','魔晶','耀石','熔岩','風暴','星環','龍捲','彗星'];

      for (let i = 0; i < count; i++) {
        const hue = Math.floor((i / count) * 360);
        const color1 = `hsl(${hue}, 80%, 60%)`; const color2 = `hsl(${(hue + 20) % 360}, 100%, 40%)`;
        cssString += `.t-${i} { background: linear-gradient(135deg, ${color1}, ${color2}); } .bg-t-${i} { background: linear-gradient(135deg, ${color1}, ${color2}); }`;
        const e = emojis[i % emojis.length]; const n = names[i % names.length] + `聯盟`;
        teamsData.push({ id: i, name: `${e} ${n}`, class: `t-${i}`, gradient: `linear-gradient(135deg, ${color1}, ${color2})`, players: [] });
      }
      document.getElementById('dynamicTeamStyles').innerHTML = cssString;
    }

    function initLobby() {
      initAudio();
      let shuffleInput = parseInt(document.getElementById('cfgShuffle').value);
      gameConfig = {
        isTeamMode: document.getElementById('cfgMode').value === 'teams',
        teamCount: parseInt(document.getElementById('cfgTeams').value) || 2,
        maxPerTeam: parseInt(document.getElementById('cfgMax').value) || 10,
        groupTime: parseInt(document.getElementById('cfgTime').value) || 60,
        winMode: document.getElementById('cfgWin').value,
        shuffleRound: (isNaN(shuffleInput) || shuffleInput <= 0) ? -1 : shuffleInput,
        useMedia: document.getElementById('cfgMedia').checked,
        useAdvType: document.getElementById('cfgAdvType').checked,
        useEconomy: document.getElementById('cfgEconomy').checked,
        useSabotage: document.getElementById('cfgSabotage').checked,
        useGhost: document.getElementById('cfgGhost').checked,
        useExtreme: document.getElementById('cfgExtreme').checked
      };

      generateTeamStyles(gameConfig.teamCount);
      const bucketsContainer = document.getElementById('teamBuckets'); bucketsContainer.innerHTML = '';

      if (gameConfig.isTeamMode) {
        document.getElementById('lobbyWaitText').innerText = "✨ 掃描 QR Code 選擇陣營！";
        document.getElementById('lobbyTimerBox').innerHTML = `倒數自動分組：<span id="groupTimerText">${gameConfig.groupTime}</span> 秒`;
        document.getElementById('forceStartBtn').innerText = "跳過等待，隨機分組並開始 ➡️";
        
        teamsData.forEach(t => {
          bucketsContainer.innerHTML += `<div class="team-bucket ${t.class}" id="bucket-${t.id}"><div class="team-title">${t.name} (0/${gameConfig.maxPerTeam})</div><div id="players-${t.id}"></div></div>`;
        });
      } else {
        document.getElementById('lobbyWaitText').innerText = "✨ 掃描 QR Code 加入英雄榜！";
        document.getElementById('lobbyTimerBox').style.display = 'inline-block'; 
        document.getElementById('lobbyTimerBox').innerHTML = `倒數開始遊戲：<span id="groupTimerText">${gameConfig.groupTime}</span> 秒`;
        document.getElementById('forceStartBtn').innerText = "跳過等待，立刻開始 ➡️";
        bucketsContainer.style.display = "flex"; bucketsContainer.style.flexWrap = "wrap"; bucketsContainer.style.justifyContent = "center";
      }

      document.getElementById('setupScreen').style.display = 'none'; document.body.className = 'bg-lobby';
      document.getElementById('lobbyScreen').style.display = 'block';

      peer = new Peer('minikahoot-' + roomCode);
      peer.on('open', (id) => {
        new QRCode(document.getElementById("qrcode"), { text: window.location.href.replace('host.html', '') + "?pin=" + roomCode, width: 140, height: 140, colorDark : "#ff4b2b", colorLight : "#fff", correctLevel : QRCode.CorrectLevel.H });
        loadQuestions(); 
      });

      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('data', (data) => {
          if (data.type === 'JOIN') {
            playJoin(); conn.playerName = data.name;
            if(!playerStats[data.name]) playerStats[data.name] = { teamId: -1, score: 0, correctCount: 0, fastWins: 0, fastScore: 0, streak: 0, hasShield: false, isGhost: false, isTraitor: false, avatar: '👤' };
            
            if (gameConfig.isTeamMode) {
              conn.send({ type: 'TEAM_SELECTION_START', teams: teamsData, max: gameConfig.maxPerTeam, css: document.getElementById('dynamicTeamStyles').innerHTML, cfg: gameConfig });
            } else {
              const tag = createPlayerTagElement(data.name, '👤', `ptag-${data.name}`);
              bucketsContainer.appendChild(tag);
              conn.send({ type: 'INDIVIDUAL_MODE_WAIT', cfg: gameConfig });
            }
          }
          else if (data.type === 'SYNC_AVATAR') {
             if(playerStats[conn.playerName]) {
                 playerStats[conn.playerName].avatar = data.avatar;
                 let ptag = document.getElementById(`ptag-${conn.playerName}`);
                 if(ptag) ptag.innerHTML = `<span style="font-size:28px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));">${data.avatar}</span> <span style="text-shadow: 0 1px 2px rgba(255,255,255,0.8);">${conn.playerName}</span>`;
             }
          }
          else if (data.type === 'SELECT_TEAM' && gameConfig.isTeamMode) { handleTeamSelection(conn, data.teamId); }
          else if (data.type === 'ANSWER') { handleAnswer(conn, data); }
          else if (data.type === 'USE_SKILL' && gameConfig.useSabotage) { handleSkill(conn, data.skill); }
          else if (data.type === 'SUBMIT_WAGER' && gameConfig.useEconomy) { 
            conn.wager = data.amount; 
            if(data.target) conn.bountyTarget = data.target; else conn.bountyTarget = null;
          }
          else if (data.type === 'SUBMIT_BID' && gameConfig.useExtreme) { conn.bidAmount = data.amount; }
        });
      });

      let timeLeft = gameConfig.groupTime; 
      const timerTextEl = document.getElementById('groupTimerText');
      if(timerTextEl) timerTextEl.innerText = timeLeft;
      
      groupTimerInterval = setInterval(() => {
        timeLeft--; 
        if(document.getElementById('groupTimerText')) document.getElementById('groupTimerText').innerText = timeLeft;
        if(timeLeft <= 0) { clearInterval(groupTimerInterval); autoAssignAndStart(); }
      }, 1000);
    }

    function handleTeamSelection(conn, teamId) {
      const pName = conn.playerName; const team = teamsData.find(t => t.id === teamId);
      if (team && team.players.length < gameConfig.maxPerTeam && playerStats[pName].teamId === -1) {
        team.players.push(pName); playerStats[pName].teamId = teamId;
        document.getElementById(`bucket-${teamId}`).querySelector('.team-title').innerText = `${team.name} (${team.players.length}/${gameConfig.maxPerTeam})`;
        
        const pTag = createPlayerTagElement(pName, playerStats[pName].avatar, `ptag-${pName}`);
        document.getElementById(`players-${teamId}`).appendChild(pTag);
        
        conn.send({ type: 'TEAM_ASSIGNED', teamName: team.name, teamClass: team.class, teamGrad: team.gradient, cfg: gameConfig });
        broadcast({ type: 'TEAM_UPDATED', teams: teamsData, max: gameConfig.maxPerTeam }); playJoin();
      }
    }

    function handleSkill(conn, skillType) {
      const pName = conn.playerName; const stats = playerStats[pName];
      if (skillType === 'shield' && stats.score >= 300) {
        stats.score -= 300; stats.hasShield = true;
        conn.send({ type: 'SKILL_SUCCESS', msg: "護盾啟動！可抵禦一次攻擊。" });
      } else if (skillType === '5050' && stats.score >= 200) {
        const qType = questions[currentQIndex].type;
        if (qType === 'single' || qType === 'multiple') {
          stats.score -= 200;
          const correctAns = questions[currentQIndex].correct;
          const totalOpts = questions[currentQIndex].options.length;
          let wrongOpts = Array.from({length: totalOpts}, (_, i) => i).filter(i => !correctAns.includes(i));
          let removeCount = Math.floor(wrongOpts.length / 2);
          if (removeCount < 1 && wrongOpts.length > 0) removeCount = 1;
          wrongOpts = wrongOpts.sort(() => 0.5 - Math.random()).slice(0, removeCount); 
          conn.send({ type: 'SKILL_5050_RESULT', wrongOpts: wrongOpts });
        } else { conn.send({ type: 'SKILL_SUCCESS', msg: "此題型無法使用 50/50 救援！" }); }
      } else if ((skillType === 'freeze' || skillType === 'scramble') && stats.score >= 500) {
        let enemies = [];
        if (gameConfig.isTeamMode) {
           enemies = connections.filter(c => c.playerName && c.playerName !== pName && playerStats[c.playerName].teamId !== stats.teamId && !playerStats[c.playerName].isGhost);
        } else {
           enemies = connections.filter(c => c.playerName && c.playerName !== pName && !playerStats[c.playerName].isGhost);
        }

        if(enemies.length > 0) {
          stats.score -= 500;
          let tgtConn = enemies[Math.floor(Math.random() * enemies.length)];
          if (playerStats[tgtConn.playerName].hasShield) {
            playerStats[tgtConn.playerName].hasShield = false;
            conn.send({ type: 'SKILL_SUCCESS', msg: `攻擊了 ${tgtConn.playerName}，但被對方的護盾擋下了！` });
          } else {
            tgtConn.send({ type: 'BE_ATTACKED', effect: skillType });
            conn.send({ type: 'SKILL_SUCCESS', msg: `成功對 ${tgtConn.playerName} 發動戰術干擾！` });
          }
        } else { conn.send({ type: 'SKILL_SUCCESS', msg: `找不到敵人可以攻擊！` }); }
      }
    }

    function autoAssignAndStart() {
      clearInterval(groupTimerInterval);
      if (gameConfig.isTeamMode) {
        let unassignedConns = connections.filter(c => c.playerName && playerStats[c.playerName].teamId === -1);
        unassignedConns.sort(() => Math.random() - 0.5);
        unassignedConns.forEach(conn => {
          let availableTeams = teamsData.filter(t => t.players.length < gameConfig.maxPerTeam);
          if(availableTeams.length > 0) {
            availableTeams.sort((a,b) => a.players.length - b.players.length);
            const t = availableTeams[0]; t.players.push(conn.playerName); playerStats[conn.playerName].teamId = t.id;
            conn.send({ type: 'TEAM_ASSIGNED', teamName: t.name, teamClass: t.class, teamGrad: t.gradient, cfg: gameConfig });
          }
        });
      }
      document.getElementById('lobbyScreen').style.display = 'none';
      nextQuestion();
    }

    async function loadQuestions() {
      if (!SHEET_CSV_URL) { useDefaultQuestions(); return; }
      try {
        const response = await fetch(SHEET_CSV_URL); const csvText = await response.text();
        Papa.parse(csvText, { header: false, skipEmptyLines: true, complete: function(results) {
            questions = results.data.slice(1).map(row => {
              if(!row[0]) return null;
              const type = row[0].trim().toLowerCase();
              const q = row[1].trim();
              const correctArray = row[2].toString().split(',').map(n => parseInt(n.trim()));
              const modeRaw = row[3] ? row[3].trim().toLowerCase() : 'normal';
              const mediaUrl = row[4] ? row[4].trim() : '';
              
              let timeLimit = parseInt(row[5]);
              if (isNaN(timeLimit) || timeLimit <= 0) { timeLimit = (modeRaw.includes('fast')) ? 10 : 15; }

              let opts = [];
              for(let i = 6; i < row.length; i++) {
                 if(row[i] !== undefined && row[i].trim() !== '') opts.push(row[i].trim());
              }
              if (opts.length === 0) opts = ["正確", "錯誤"];
              return { type: type, q: q, options: opts, correct: correctArray, mode: modeRaw, media: mediaUrl, time: timeLimit };
            }).filter(q => q);
          }
        });
      } catch (err) { useDefaultQuestions(); }
    }
    
    function useDefaultQuestions() {
      questions = [
        { type: "single", mode: "normal", q: "【無限制選項展示】一星期有幾天？(七個選項)", options: ["1天", "2天", "3天", "4天", "5天", "6天", "7天"], correct: [6], media: "", time: 15 },
        { type: "single", mode: "minefield", q: "【地雷陷阱】選錯直接扣500分！太陽系中最大的行星是？", options: ["金星", "火星", "木星", "地球"], correct: [2], media: "", time: 15 },
        { type: "single", mode: "memory", q: "【閃憶模式】選項只有3秒記憶時間！蘋果的英文是？", options: ["Apple", "Banana", "Cherry", "Date"], correct: [0], media: "", time: 10 },
        { type: "single", mode: "chameleon", q: "【迷霧文字】字體會忽隱忽現！水的化學式？", options: ["CO2", "H2O", "O2", "H2"], correct: [1], media: "", time: 15 },
        { type: "single", mode: "auction", q: "【搶答拍賣】出價最高的隊伍才能回答！答對贏雙倍，答錯倒扣！", options: ["紅", "綠", "藍", "黃"], correct: [2], media: "", time: 20 },
        { type: "single", mode: "traitor", q: "【背叛者模式】有內鬼！請找出誰在說謊誤導大家！", options: ["A", "B", "C", "D"], correct: [3], media: "", time: 20 },
        { type: "match_drag", mode: "normal", q: "【連連看-拖曳】依大螢幕圖示，在手機將選項拖曳排序！", options: ["蘋果", "香蕉", "葡萄", "西瓜", "芒果"], correct: [0, 1, 2, 3, 4], media: "🍎 | 🍌 | 🍇 | 🍉 | 🥭", time: 30 },
        { type: "match_click", mode: "normal", q: "【連連看-按壓】依照大螢幕隨機出現的順序，在手機依序點擊", options: ["春天", "夏天", "秋天", "冬天"], correct: [0, 1, 2, 3], media: "Spring | Summer | Autumn | Winter", time: 25 },
        { type: "slider", mode: "normal", q: "【精準拉桿】水在常溫常壓的沸點是幾度？", options: ["0", "200"], correct: [100], media: "", time: 15 }
      ];
    }

    function broadcast(messageObj, targetName = null) { connections.forEach(conn => { if (conn.open) { if (!targetName || conn.playerName === targetName) conn.send(messageObj); } }); }

    function handleAnswer(conn, data) {
          if (!isAcceptingAnswers || answeredPlayers.has(conn.playerName)) return;
          const qData = questions[currentQIndex]; 

          if (qData.mode === 'auction' && gameConfig.useExtreme) {
            if(gameConfig.isTeamMode) { if (playerStats[conn.playerName].teamId !== highestBidder) return; } 
            else { if (conn.playerName !== highestBidder) return; }
          }

          // 1. 登記玩家已作答
          answeredPlayers.add(conn.playerName);

          // =========================================================
          // 🌟 【新增】即時動態進場邏輯開始
          // =========================================================
          let currentRank = answeredPlayers.size;
          let countEl = document.getElementById('answeredCount');
          if (countEl) countEl.innerText = currentRank;

          // 抓取玩家的專屬頭像 (如果沒抓到就給預設的人影)
          let playerAvatar = playerStats[conn.playerName] ? playerStats[conn.playerName].avatar : '👤';

          // 判斷名次給予專屬獎牌與特殊樣式
          let medal = '✅';
          let extraClass = '';
          if (currentRank === 1) { medal = '🥇'; extraClass = 'top-1'; }
          else if (currentRank === 2) { medal = '🥈'; extraClass = 'top-2'; }
          else if (currentRank === 3) { medal = '🥉'; extraClass = 'top-3'; }

          // 建立果凍標籤並塞入畫面
          let tagHTML = document.createElement('div');
          tagHTML.className = `answered-tag ${extraClass}`;
          tagHTML.innerHTML = `<span>${medal}</span> <span style="font-size: 20px;">${playerAvatar}</span> <span>${conn.playerName}</span>`;
          
          let gridEl = document.getElementById('answeredGrid');
          if (gridEl) gridEl.appendChild(tagHTML);

          // 發出泡泡音效 (前提是您有在前面加入 playPopSound 函數)
          if (typeof playPopSound === 'function') playPopSound();
          // =========================================================
          // 🌟 即時動態進場邏輯結束
          // =========================================================


          const correctAnsArray = qData.correct;
          const answers = data.answers;
          let isCorrect = false; let earnedScore = 0;
          let timeTaken = Date.now() - questionStartTime;
          const maxTimeMs = (qData.time || 15) * 1000;

          if (qData.mode === 'majority' && gameConfig.useAdvType) {
            conn.tempResult = { isCorrect: false, earnedScore: 0, pVal: answers[0], timeTaken: timeTaken };
            currentRoundData.push({ name: conn.playerName, time: timeTaken, isCorrect: false, scoreToAdd: 0 });
            return;
          }

          if (qData.type === 'slider' && gameConfig.useAdvType) {
            const pVal = parseInt(answers[0]); const cVal = qData.correct[0];
            const range = parseInt(qData.options[1]) - parseInt(qData.options[0]);
            const err = Math.abs(pVal - cVal);
            if (err === 0) { isCorrect = true; earnedScore = 1000; }
            else if (err <= range * 0.2) { isCorrect = true; earnedScore = Math.floor(1000 * (1 - err/(range*0.2))); } 
          } 
          else if ((qData.type === 'order' || qData.type === 'match_drag' || qData.type === 'match_click') && gameConfig.useAdvType) {
            let refArray = (qData.type.startsWith('match_')) ? currentScrambledCorrect : qData.correct;
            if (answers.length === refArray.length && answers.every((v, i) => v === refArray[i])) { 
                isCorrect = true; earnedScore = 1000; 
            } else {
                let correctPos = 0;
                answers.forEach((v, i) => { if(v === refArray[i]) correctPos++; });
                earnedScore = Math.floor(correctPos * (1000 / refArray.length));
                if(correctPos === refArray.length) isCorrect = true;
            }
          } 
          else {
            if (answers.length > 0) {
              let correctCount = 0; let wrongSelected = false;
              for (let i = 0; i < answers.length; i++) { if (qData.correct.includes(answers[i])) correctCount++; else { wrongSelected = true; break; } }
              if (!wrongSelected && answers.length === qData.correct.length) { isCorrect = true; earnedScore = 1000; }
              else if (!wrongSelected) { isCorrect = true; earnedScore = Math.floor(1000 * (correctCount / qData.correct.length)); }
            }
          }

          if (qData.mode === 'fog' && gameConfig.useMedia && isCorrect) {
            earnedScore = Math.floor(earnedScore * ((maxTimeMs - timeTaken) / maxTimeMs));
            if(earnedScore < 100) earnedScore = 100;
          }

          if ((qData.mode === 'fast_single' || qData.mode === 'fast_rank') && gameConfig.useExtreme && !isCorrect && timeTaken < 3000) {
            earnedScore = -300;
          }

          if (qData.mode === 'minefield' && gameConfig.useExtreme && !isCorrect) {
            earnedScore = -500;
          }

          let multiplier = 1;
          if (gameConfig.useEconomy) {
            if (isCorrect) { multiplier = 1 + (playerStats[conn.playerName].streak * 0.2); if(multiplier > 1.5) multiplier = 1.5; }
          }
          earnedScore = Math.floor(earnedScore * multiplier);
          
          if (qData.mode === 'wager' && gameConfig.useEconomy) {
            let wagerAmt = conn.wager || 0;
            if (isCorrect) earnedScore += wagerAmt; else earnedScore -= wagerAmt; 
          } else if (qData.mode === 'auction' && gameConfig.useExtreme) {
            if (isCorrect) earnedScore += highestBid; else earnedScore -= highestBid;
          }

          conn.tempResult = { isCorrect, earnedScore, pVal: answers[0], timeTaken: timeTaken };
          currentRoundData.push({ name: conn.playerName, time: timeTaken, isCorrect: isCorrect, scoreToAdd: earnedScore });

          if (qData.mode === 'fast_single' && isCorrect) {
            playFirstBlood(); clearInterval(countdownInterval); isAcceptingAnswers = false; broadcast({ type: 'DISABLE_BUTTONS' }); revealAnswer(); 
          }
        }

        let counts = {};
        for(let i=0; i<questions[currentQIndex].options.length; i++) counts[i] = 0;
        connections.forEach(c => { if(c.tempResult && c.tempResult.pVal !== undefined) counts[c.tempResult.pVal]++; });
        let maxVote = -1; let maxOpt = 0;
        for(let i=0; i<questions[currentQIndex].options.length; i++) { if(counts[i] > maxVote) { maxVote = counts[i]; maxOpt = i; } }
        correctAns = [maxOpt];
        
        connections.forEach(c => {
          if(c.tempResult && c.tempResult.pVal !== undefined) {
            if(c.tempResult.pVal === maxOpt) { c.tempResult.isCorrect = true; c.tempResult.earnedScore = 1000; }
            const rData = currentRoundData.find(d => d.name === c.playerName);
            if(rData) { rData.isCorrect = c.tempResult.isCorrect; rData.scoreToAdd = c.tempResult.earnedScore; }

      confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 }, colors: ['#fff', '#f1c40f', '#2ecc71'] });
      
      if (qType === 'slider' && gameConfig.useAdvType) {
        document.getElementById('sliderResult').innerText = `精準正解是：${correctAns[0]}！`;
      } 
      else if ((qType === 'match_drag' || qType === 'match_click') && gameConfig.useAdvType) {
        let opts = questions[currentQIndex].options;
        let correctStr = currentScrambledCorrect.map(i => opts[i]).join(' ➡️ ');
        document.getElementById('matchPromptsContainer').innerHTML = `<h3 style='width:100%; color:#2ecc71; font-size:42px;'>正解順序：<br>${correctStr}</h3>`;
      } 
      else {
        const options = document.querySelectorAll('.option');
        options.forEach((opt, i) => {
          opt.classList.remove('floating-opt');
          opt.style.animation = 'none'; 
          if(currentMode === 'memory') opt.querySelector('.opt-text').innerText = questions[currentQIndex].options[i];
          if (correctAns.includes(i)) opt.classList.add('highlight'); else opt.classList.add('dimmed');
        });
      }

      connections.forEach(conn => {
        if(conn.playerName) {
          const stats = playerStats[conn.playerName];
          if(conn.tempResult) {
            stats.score += conn.tempResult.earnedScore;
            if (conn.tempResult.isCorrect) {
              stats.correctCount++;
              if(currentMode === 'fast_single' || currentMode === 'fast_rank') { stats.fastWins++; stats.fastScore += conn.tempResult.earnedScore; }
              stats.isGhost = false; 
              stats.streak++;
            } else {
              if(gameConfig.useGhost) stats.isGhost = true; 
              stats.streak = 0;
            }

            if(currentMode === 'bounty' && conn.bountyTarget != null) {
              let wagerAmt = conn.wager || 500; let targetFailed = true;
              if(gameConfig.isTeamMode) { connections.forEach(tc => { if(playerStats[tc.playerName]?.teamId == conn.bountyTarget && tc.tempResult?.isCorrect) targetFailed = false; }); } 
              else { let tc = connections.find(c => c.playerName == conn.bountyTarget); if (tc && tc.tempResult && tc.tempResult.isCorrect) targetFailed = false; }
              if(targetFailed) { stats.score += wagerAmt; conn.send({type:'SKILL_SUCCESS', msg:`賞金獵取成功！+${wagerAmt}分`}); }
              else { stats.score -= wagerAmt; conn.send({type:'SKILL_SUCCESS', msg:`賞金獵取失敗！目標答對了，-${wagerAmt}分`}); }
            }
          } else {
            if(gameConfig.useGhost) stats.isGhost = true;
            stats.streak = 0;
          }
        }
      });

      if(currentMode === 'traitor' && gameConfig.useExtreme && gameConfig.isTeamMode) {
          teamsData.forEach(t => {
              let traitorName = t.players.find(p => playerStats[p].isTraitor);
              if (traitorName) {
                  let traitorData = currentRoundData.find(d => d.name === traitorName);
                  let teammatesWrong = currentRoundData.filter(d => d.name !== traitorName && t.players.includes(d.name) && !d.isCorrect);
                  if (traitorData && !traitorData.isCorrect && teammatesWrong.length > 0) {
                      playerStats[traitorName].score += 500; 
                      teammatesWrong.forEach(tm => { playerStats[tm.name].score -= 200; }); 
                  }
              }
          });
      }

      if(gameConfig.useGhost && gameConfig.isTeamMode) {
        teamsData.forEach(t => {
          let anyCorrect = false;
          t.players.forEach(p => { 
             let c = connections.find(conn => conn.playerName === p);
             if(c && c.tempResult && c.tempResult.isCorrect) anyCorrect = true; 
          });
          if(anyCorrect) { t.players.forEach(p => playerStats[p].isGhost = false); }
        });
      }

      setTimeout(() => {
        document.getElementById('questionBox').style.display = 'none';
        if (currentMode === 'fast_single' || currentMode === 'fast_rank') showRoundRanking(currentMode);
        else { document.getElementById('leaderboard').style.display = 'block'; renderLeaderboard(); document.getElementById('nextBtnLeader').style.display = 'inline-block'; }
      }, 3000);
    }

    function showRoundRanking(mode) {
      document.getElementById('roundRanking').style.display = 'block';
      const top3Container = document.getElementById('roundTop3'); top3Container.innerHTML = '';
      document.getElementById('roundTitle').innerText = mode === 'fast_single' ? "⚡ 光速唯一獲勝者！" : "🌟 極速手速前三名";
      const correctPlayers = currentRoundData.filter(d => d.isCorrect).sort((a, b) => a.time - b.time);
      
      if (correctPlayers.length === 0) { top3Container.innerHTML = `<h2 style="width:100%; color:#c0392b;">全軍覆沒！沒人答對 😭</h2>`; return; }

      const displayCount = mode === 'fast_single' ? 1 : 3;
      for(let i=0; i<displayCount; i++) {
        if(correctPlayers[i]) {
          const p = correctPlayers[i]; const timeSec = (p.time / 1000).toFixed(3);
          let rankClass = i === 0 ? 'r-1' : (i === 1 ? 'r-2' : 'r-3'); let medal = i === 0 ? '🥇' : (i === 1 ? '🥈' : '🥉');
          
          let teamTagHtml = "";
          let avatarHtml = `<span style="font-size:32px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));">${playerStats[p.name].avatar}</span>`;

          if (gameConfig.isTeamMode) {
            const pTeamId = playerStats[p.name].teamId; const tGrad = teamsData.find(t => t.id === pTeamId).gradient;
            teamTagHtml = `<div style="font-size:16px; margin-bottom:5px; background:${tGrad}; border-radius:10px; padding:2px;">${teamsData[pTeamId].name}</div>`;
          }

          top3Container.innerHTML += `
            <div class="r-card ${rankClass}" style="animation-delay: ${i*0.2}s">
              <div style="font-size:30px; margin-bottom:10px;">${medal}</div>
              <div style="margin-bottom:5px;">${avatarHtml}</div>
              <div class="r-name">${p.name}</div>
              ${teamTagHtml}
              <div class="r-time">${timeSec}s</div>
            </div>
          `;
          if(i===0) confetti({ particleCount: 100, spread: 80, origin: { y: 0.5 } });
        }
      }
    }

    function showTotalLeaderboard() { document.getElementById('roundRanking').style.display = 'none'; document.getElementById('leaderboard').style.display = 'block'; renderLeaderboard(); document.getElementById('nextBtnLeader').style.display = 'inline-block'; }

    function renderLeaderboard() {
      const list = document.getElementById('scoreList'); list.innerHTML = '';
      let rankedData = [];
      if (gameConfig.isTeamMode) {
        rankedData = teamsData.map(t => {
          let score = 0; t.players.forEach(p => score += playerStats[p].score);
          return { name: `<span style="background:${t.gradient}; padding:5px 15px; border-radius:10px; color:white;">${t.name}</span>`, score: score };
        });
      } else { 
        rankedData = Object.keys(playerStats).map(pName => { return { name: pName, score: playerStats[pName].score, avatar: playerStats[pName].avatar }; }); 
      }
      
      rankedData.sort((a, b) => b.score - a.score);
      rankedData.slice(0, 10).forEach((item, index) => {
        let li = document.createElement('li'); li.className = 'rank-item'; li.style.animationDelay = `${index * 0.1}s`;
        let medal = index === 0 ? "👑" : index === 1 ? "💎" : index === 2 ? "🌟" : "🔥";
        let streakHtml = ''; let ghostHtml = '';
        if(!gameConfig.isTeamMode && playerStats[item.name]) {
          if(playerStats[item.name].streak >= 2) streakHtml = `<span class="player-tag fire-streak" style="font-size:16px;">🔥 x${playerStats[item.name].streak}</span>`;
          if(playerStats[item.name].isGhost) ghostHtml = ` <span style="font-size:24px;">👻</span>`;
        }
        
        let avatarHtml = gameConfig.isTeamMode ? "" : `<span style="font-size:32px; margin-right:10px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));">${item.avatar}</span>`;
        
        li.innerHTML = `<span>${medal} ${avatarHtml}${item.name} ${streakHtml} ${ghostHtml}</span> <span class="rank-score">${item.score}</span>`;
        list.appendChild(li);
      });
    }

    function showTeamPodium() {
      playWin(); document.body.className = "bg-podium";
      document.getElementById('questionBox').style.display = 'none'; document.getElementById('leaderboard').style.display = 'none';
      
      let finalData = []; let titleText = "";

      if (gameConfig.isTeamMode) {
        finalData = teamsData.map(t => {
          let tScore=0, tCorrect=0, tFastWin=0, tFastScore=0;
          t.players.forEach(p => { tScore += playerStats[p].score; tCorrect += playerStats[p].correctCount; tFastWin += playerStats[p].fastWins; tFastScore += playerStats[p].fastScore; });
          let pCount = Math.max(1, t.players.length);
          return { name: t.name, metric: 0, display: "", raw: {tScore, tCorrect, tFastWin, tFastScore, pCount} };
        });
        const mode = gameConfig.winMode; 
        finalData.forEach(t => {
          if(mode === "1") { t.metric = t.raw.tScore; t.display = `${t.metric} 分`; titleText="聯盟總積分冠軍"; }
          if(mode === "2") { t.metric = t.raw.tCorrect; t.display = `答對 ${t.metric} 題`; titleText="聯盟答對數冠軍"; }
          if(mode === "3") { t.metric = Math.floor(t.raw.tScore / t.raw.pCount); t.display = `平均 ${t.metric} 分`; titleText="聯盟平均分冠軍"; }
          if(mode === "4") { t.metric = (t.raw.tCorrect / t.raw.pCount).toFixed(1); t.display = `平均答對 ${t.metric} 題`; titleText="精英聯盟冠軍"; }
          if(mode === "5") { t.metric = t.raw.tFastWin; t.display = `神手 ${t.metric} 次`; titleText="閃電神手聯盟"; }
          if(mode === "6") { t.metric = t.raw.tFastScore; t.display = `搶答 ${t.metric} 分`; titleText="極速搶分聯盟"; }
        });
      } else {
        titleText = "個人總積分冠軍";
        finalData = Object.keys(playerStats).map(pName => { return { name: pName, metric: playerStats[pName].score, display: `${playerStats[pName].score} 分`, avatar: playerStats[pName].avatar }; });
      }

      finalData.sort((a, b) => b.metric - a.metric);
      document.getElementById('podiumTitle').innerText = `🏆 ${titleText} 🏆`; document.getElementById('podiumContainer').style.display = 'flex';
      for(let i=0; i<3; i++) {
        const place = i+1;
        if(finalData[i] && finalData[i].metric > 0) { 
           let avatarHtml = gameConfig.isTeamMode ? "" : `<div style="font-size:50px; margin-bottom:10px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));">${finalData[i].avatar}</div>`;
           document.getElementById(`name-${place}`).innerHTML = `${avatarHtml}${finalData[i].name}`; 
           document.getElementById(`score-${place}`).innerText = finalData[i].display; 
        } 
        else { document.getElementById(`name-${place}`).innerText = "無"; document.getElementById(`score-${place}`).innerText = "-"; }
      }
      var duration = 15 * 1000; var end = Date.now() + duration;
      (function frame() {
        confetti({ particleCount: 10, angle: 60, spread: 80, origin: { x: -0.1 }, colors: ['#f1c40f', '#e74c3c', '#3498db'] });
        confetti({ particleCount: 10, angle: 120, spread: 80, origin: { x: 1.1 }, colors: ['#f1c40f', '#e74c3c', '#3498db'] });
        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    }
  </script>
</body>
